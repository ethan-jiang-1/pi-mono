<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <title id="title">检查分流：哪个触发器跑哪些检查</title>
  <desc id="desc">pi-mono v1.0.3 的检查按触发器分流：本地 commit 走 pre-commit，PR 走主 CI 两个 job，分支与日历触发环境矩阵、Nix、audit 与模型目录，tag 触发六阶段发布管线，真实模型评估需要手动凭据；「CI 绿」只覆盖其中一列。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#475569"/></marker>
  </defs>
  <rect width="1120" height="640" fill="#ffffff"/>
  <text x="560" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#172033">检查分流：哪个触发器跑哪些检查（v1.0.3）</text>
  <text x="560" y="62" text-anchor="middle" font-size="12" fill="#5f6b7a">回答「CI 是否通过」之前先问：哪个 CI、哪个 job、什么触发器</text>

  <rect x="40" y="270" width="190" height="120" rx="10" fill="#172033"/>
  <text x="135" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">一次变更</text>
  <text x="135" y="338" text-anchor="middle" font-size="11" fill="#aeb9c8">commit · PR · tag</text>
  <text x="135" y="358" text-anchor="middle" font-size="11" fill="#aeb9c8">schedule · 手动</text>

  <g font-size="12">
    <rect x="290" y="92" width="800" height="78" rx="8" fill="#edf5ff" stroke="#5791c9"/>
    <text x="312" y="118" font-weight="700" fill="#173f67">本地 commit（启用 hook 时）</text>
    <text x="312" y="140" fill="#526175">pre-commit：lockfile gate（PI_ALLOW_LOCKFILE_CHANGE 豁免）+ npm run check</text>
    <text x="312" y="158" fill="#526175">staged 命中 ai / web-ui / package.json 时额外 browser smoke</text>

    <rect x="290" y="182" width="800" height="78" rx="8" fill="#edf8f1" stroke="#55a36f"/>
    <text x="312" y="208" font-weight="700" fill="#1f6139">PR / push main（主 CI ci.yml）</text>
    <text x="312" y="230" fill="#526175">build-check-test：build · check · npm test（Linux 单 runner）</text>
    <text x="312" y="248" fill="#526175">mcp-conformance：对 pinned 官方套件回归</text>

    <rect x="290" y="272" width="800" height="78" rx="8" fill="#fff5e6" stroke="#d99939"/>
    <text x="312" y="298" font-weight="700" fill="#744408">分支 / 路径 / 日历触发</text>
    <text x="312" y="320" fill="#805915">durable-env：durable-env-* 分支或手动 · 五 OS matrix</text>
    <text x="312" y="338" fill="#805915">nix：路径 PR + tag + 每日 + workflow_run · audit：每日 schedule（moderate 门槛）</text>

    <rect x="290" y="362" width="800" height="78" rx="8" fill="#f3efff" stroke="#8269bd"/>
    <text x="312" y="388" font-weight="700" fill="#513b85">tag v*（发布管线 build-binaries.yml）</text>
    <text x="312" y="410" fill="#526175">源码归档构建六平台 → smoke → draft Release → npm trusted publishing</text>
    <text x="312" y="428" fill="#526175">→ R2 公告（latest 指针只前进）→ 公开 Release；失败删草稿可重跑</text>

    <rect x="290" y="452" width="800" height="78" rx="8" fill="#eaf7f6" stroke="#3b9a91"/>
    <text x="312" y="478" font-weight="700" fill="#1d5f59">手动 / 凭据（不在普通 CI）</text>
    <text x="312" y="500" fill="#526175">evals 真实模型评估（PI_PROVIDER / PI_MODEL）· 模型目录生产发布（publish=true）</text>
    <text x="312" y="518" fill="#526175">packages/evals 的基础单测仍随 workspace test 进入主 CI</text>
  </g>

  <path d="M230 310 H250 V131 H286" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M230 316 H250 V221 H286" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M230 326 H250 V311 H286" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M230 336 H250 V401 H286" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M230 346 H250 V491 H286" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="40" y="556" width="1050" height="42" rx="8" fill="#fdf0ef" stroke="#c25550"/>
  <text x="565" y="582" text-anchor="middle" font-size="11.5" fill="#7a2a26">「CI 绿」只证明第二行两个 Linux job 通过；不证明环境矩阵、Nix 产物、审计、发布二进制或真实模型行为</text>
  <text x="560" y="624" text-anchor="middle" font-size="11" fill="#5f6b7a">来源：earendil-works/pi v1.0.3 · ci.yml / durable-env.yml / nix.yml / npm-audit.yml / build-binaries.yml / publish-model-catalog.yml</text>
</svg>
