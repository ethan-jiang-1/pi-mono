<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <title id="title">验证分层：每种验证只证明它观察的对象</title>
  <desc id="desc">四种验证方式按观察对象分工：faux provider 脚本化断言证明程序合同、真实交互证明端到端存活、干净安装证明 package 声明完整、会话账本证明实际发生了什么；每层右侧列出它不能证明的事。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#475569"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#172033">验证分层：每种验证只证明它观察的对象</text>
  <text x="500" y="62" text-anchor="middle" font-size="12" fill="#5f6b7a">faux provider 与 SDK 经 @earendil-works/pi-ai/compat 公开导出，独立扩展仓可复用同款分层</text>

  <rect x="30" y="90" width="220" height="360" rx="8" fill="#edf5ff" stroke="#5791c9" stroke-width="1.5"/>
  <text x="140" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#173f67">faux provider 断言</text>
  <text x="140" y="140" text-anchor="middle" font-size="10.5" fill="#526175">脚本化响应驱动真实 AgentSession</text>
  <rect x="46" y="160" width="188" height="128" rx="6" fill="#ffffff" stroke="#8bb3d7"/>
  <text x="140" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="#2f8550">能证明</text>
  <text x="140" y="204" text-anchor="middle" font-size="10.5" fill="#526175">事件顺序与 settled 边界</text>
  <text x="140" y="224" text-anchor="middle" font-size="10.5" fill="#526175">工具结果形状与 pairing</text>
  <text x="140" y="244" text-anchor="middle" font-size="10.5" fill="#526175">确定性 · 无网络 · 无费用</text>
  <rect x="46" y="300" width="188" height="128" rx="6" fill="#ffffff" stroke="#8bb3d7"/>
  <text x="140" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#b3662a">不能证明</text>
  <text x="140" y="344" text-anchor="middle" font-size="10.5" fill="#526175">真实模型会用对工具</text>
  <text x="140" y="364" text-anchor="middle" font-size="10.5" fill="#526175">provider 协议兼容</text>
  <text x="140" y="384" text-anchor="middle" font-size="10.5" fill="#526175">网络层行为</text>
  <text x="140" y="428" text-anchor="middle" font-size="10" fill="#39709f">阶梯第 3-4 级</text>

  <rect x="272" y="90" width="220" height="360" rx="8" fill="#fff5e6" stroke="#d99939" stroke-width="1.5"/>
  <text x="382" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#744408">真实交互</text>
  <text x="382" y="140" text-anchor="middle" font-size="10.5" fill="#805915">启动 Pi · 提交真实 prompt</text>
  <rect x="288" y="160" width="188" height="128" rx="6" fill="#ffffff" stroke="#d99939"/>
  <text x="382" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="#2f8550">能证明</text>
  <text x="382" y="204" text-anchor="middle" font-size="10.5" fill="#526175">扩展在真实会话可见可用</text>
  <text x="382" y="224" text-anchor="middle" font-size="10.5" fill="#526175">端到端最小存活</text>
  <rect x="288" y="300" width="188" height="128" rx="6" fill="#ffffff" stroke="#d99939"/>
  <text x="382" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#b3662a">不能证明</text>
  <text x="382" y="344" text-anchor="middle" font-size="10.5" fill="#526175">确定性回归</text>
  <text x="382" y="364" text-anchor="middle" font-size="10.5" fill="#526175">全部交互功能</text>
  <text x="382" y="428" text-anchor="middle" font-size="10" fill="#b3662a">仅启动不算通过</text>

  <rect x="514" y="90" width="220" height="360" rx="8" fill="#edf8f1" stroke="#55a36f" stroke-width="1.5"/>
  <text x="624" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6139">干净安装</text>
  <text x="624" y="140" text-anchor="middle" font-size="10.5" fill="#526175">pi install 到干净 agent dir</text>
  <rect x="530" y="160" width="188" height="128" rx="6" fill="#ffffff" stroke="#55a36f"/>
  <text x="624" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="#2f8550">能证明</text>
  <text x="624" y="204" text-anchor="middle" font-size="10.5" fill="#526175">manifest 完整 · 依赖正确</text>
  <text x="624" y="224" text-anchor="middle" font-size="10.5" fill="#526175">发现规则真实生效</text>
  <rect x="530" y="300" width="188" height="128" rx="6" fill="#ffffff" stroke="#55a36f"/>
  <text x="624" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#b3662a">不能证明</text>
  <text x="624" y="344" text-anchor="middle" font-size="10.5" fill="#526175">多版本矩阵兼容</text>
  <text x="624" y="364" text-anchor="middle" font-size="10.5" fill="#526175">全部资源组合</text>
  <text x="624" y="428" text-anchor="middle" font-size="10" fill="#1f6139">阶梯第 6 级</text>

  <rect x="756" y="90" width="220" height="360" rx="8" fill="#f3efff" stroke="#8269bd" stroke-width="1.5"/>
  <text x="866" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#513b85">会话账本</text>
  <text x="866" y="140" text-anchor="middle" font-size="10.5" fill="#526175">事后读 session JSONL</text>
  <rect x="772" y="160" width="188" height="128" rx="6" fill="#ffffff" stroke="#8269bd"/>
  <text x="866" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="#2f8550">能证明</text>
  <text x="866" y="204" text-anchor="middle" font-size="10.5" fill="#526175">实际发生了什么</text>
  <text x="866" y="224" text-anchor="middle" font-size="10.5" fill="#526175">声明变化与压缩记录</text>
  <rect x="772" y="300" width="188" height="128" rx="6" fill="#ffffff" stroke="#8269bd"/>
  <text x="866" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#b3662a">不能证明</text>
  <text x="866" y="344" text-anchor="middle" font-size="10.5" fill="#526175">逐字节网络记录</text>
  <text x="866" y="364" text-anchor="middle" font-size="10.5" fill="#526175">确定性重放</text>
  <text x="866" y="428" text-anchor="middle" font-size="10" fill="#675293">树结构 · append-only</text>

  <rect x="30" y="480" width="946" height="42" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="503" y="506" text-anchor="middle" font-size="11.5" fill="#27364a">独立扩展仓不自动拥有 Pi 托管的评估层；以上四层可自建，义务与触发条件由仓库自定</text>
  <text x="500" y="546" text-anchor="middle" font-size="11" fill="#5f6b7a">来源：综合自 earendil-works/pi v1.0.3（pi-ai/compat · test/suite · packages.md）｜验证模式命名为本语料归纳</text>
</svg>
