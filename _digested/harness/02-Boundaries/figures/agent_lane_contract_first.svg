<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="700" fill="#0f172a">内层 harness：契约优先已兑现（22 个公开方法只剩 1 个 stub）</text>

  <!-- contract (drawn first) -->
  <rect x="30" y="50" width="320" height="148" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="46" y="74" font-size="12.5" font-weight="700" fill="#14532d">契约（先画好的那一面）agent-harness.ts</text>
  <text x="46" y="96" font-size="11" fill="#166534">AgentLane(:538) / AgentHarness(:586) 两个接口</text>
  <text x="46" y="112" font-size="11" fill="#166534">HookMap：11 个 hook（before_drive / before_tool</text>
  <text x="46" y="128" font-size="11" fill="#166534">  / after_tool / transform_context…）</text>
  <text x="46" y="144" font-size="11" fill="#166534">AgentHarnessOptions：全配置面（:518）</text>
  <text x="46" y="166" font-size="11" fill="#166534">真实现 class Harness 不从 index.ts 导出 →</text>
  <text x="46" y="182" font-size="11" fill="#166534">公开面 = 接口 + AgentHarness.create（:622）</text>

  <!-- implementation (real) -->
  <rect x="370" y="50" width="322" height="148" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="386" y="74" font-size="12.5" font-weight="700" fill="#064e3b">实现（真实现）runtime/harness.ts</text>
  <text x="386" y="96" font-size="11" fill="#065f46">HookRegistry（hooks.ts:15）：11 个 hook 全有</text>
  <text x="386" y="112" font-size="11" fill="#065f46">  调用点；before_drive fail-closed、before_tool</text>
  <text x="386" y="128" font-size="11" fill="#065f46">  / after_tool 带 telemetry span</text>
  <text x="386" y="144" font-size="11" fill="#065f46">22 个公开方法中 21 个已实现</text>
  <text x="386" y="166" font-size="11" font-weight="700" fill="#b91c1c">唯一 stub：watchSession → SliceNotImplemented</text>
  <text x="386" y="182" font-size="11" fill="#065f46">create() 真 restore，返回 { harness, open }</text>

  <!-- real seam test -->
  <text x="30" y="226" font-size="12.5" font-weight="700" fill="#0f172a">真 seam 检验：三个构造点、三条 transport —— 不再是「一个半 adapter」</text>
  <rect x="30" y="238" width="210" height="50" rx="9" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="44" y="256" font-size="11" font-weight="700" fill="#4c1d95">adapter 1：session-worker.ts:834</text>
  <text x="44" y="273" font-size="10.5" fill="#6b21a8">durable worker + RPC presentation</text>
  <rect x="253" y="238" width="210" height="50" rx="9" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="267" y="256" font-size="11" font-weight="700" fill="#4c1d95">adapter 2：mini/worker/run.ts:66</text>
  <text x="267" y="273" font-size="10.5" fill="#6b21a8">自带 JSON transport 的独立探针</text>
  <rect x="476" y="238" width="216" height="50" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="490" y="256" font-size="11" font-weight="700" fill="#475569">adapter 3：faux-session-worker</text>
  <text x="490" y="273" font-size="10.5" fill="#64748b">测试宿主（faux provider，:22）</text>

  <text x="20" y="310" font-size="10.5" fill="#64748b">一个 adapter = 假想 seam；两个 = 真 seam → 现在成立（三条 transport，都真的驱动 lane）。</text>
  <text x="20" y="328" font-size="10.5" fill="#64748b">但三个构造点都不在支持面内（experimental 不进 npm 包，adapter 3 是测试 fixture）→ 短板从「没实现」变成「没被产品路径采纳」。</text>
</svg>
