<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowX" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="700" fill="#0f172a">无版本契约：breaking 变更直接砸到消费者，没有拦截</text>

  <!-- pi upgrades -->
  <rect x="30" y="60" width="180" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="44" y="84" font-size="12" font-weight="700" fill="#4c1d95">pi 升级</text>
  <text x="44" y="102" font-size="10.5" fill="#6b21a8">v0.84.4 → v0.85.1</text>
  <text x="44" y="117" font-size="10.5" fill="#6b21a8">AgentHarness 变工厂、AgentLane 全改签名</text>

  <!-- extension (old API) -->
  <rect x="30" y="160" width="180" height="70" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.6"/>
  <text x="44" y="184" font-size="12" font-weight="700" fill="#713f12">v0.84.4 时代的库消费者</text>
  <text x="44" y="202" font-size="10.5" fill="#854d0e">用了 AgentHarness class / 旧 AgentLane</text>
  <text x="44" y="217" font-size="10.5" fill="#854d0e">没有任何字段声明「我要哪个 API 版本」</text>

  <!-- no interception -->
  <line x1="210" y1="120" x2="300" y2="180" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowX)"/>
  <text x="222" y="150" font-size="11" font-weight="700" fill="#dc2626">无契约拦截</text>

  <!-- outcome -->
  <rect x="310" y="160" width="170" height="70" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="324" y="184" font-size="12" font-weight="700" fill="#7f1d1d">结果</text>
  <text x="324" y="202" font-size="10.5" fill="#991b1b">编译报错（作者升级时）</text>
  <text x="324" y="217" font-size="10.5" fill="#991b1b">或运行时炸（用户装上）</text>

  <!-- what pi has: point shims, not contract -->
  <rect x="510" y="60" width="184" height="170" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="524" y="84" font-size="11.5" font-weight="700" fill="#0f172a">pi 有的：点状 shim</text>
  <text x="524" y="104" font-size="10.5" fill="#334155">pi-ai compat 入口</text>
  <text x="524" y="120" font-size="10.5" fill="#334155">「until compat is removed」</text>
  <text x="524" y="142" font-size="10.5" fill="#334155">@deprecated 标记</text>
  <text x="524" y="158" font-size="10.5" fill="#334155">「retained for source</text>
  <text x="524" y="174" font-size="10.5" fill="#334155">  compatibility」</text>
  <text x="524" y="196" font-size="10.5" fill="#64748b">枚举式：哪里坏了补哪里</text>
  <text x="524" y="212" font-size="10.5" fill="#64748b">≠ 声明式契约</text>

  <!-- bottom key point -->
  <rect x="30" y="252" width="664" height="66" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="46" y="271" font-size="11.5" font-weight="700" fill="#7c2d12">关键区别</text>
  <text x="46" y="288" font-size="11" fill="#9a3412">枚举式 compat 救「已知的旧调用」；声明式契约防「未来的 breaking 静默伤害」。</text>
  <text x="46" y="303" font-size="11" fill="#9a3412">pi 现在只有前者。落点已明：PiManifest（pi-manifest.ts）加 apiVersion 字段。</text>
</svg>
