<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="580" viewBox="0 0 1060 580" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <title id="title">范围纪律与成本合同：约束从提醒变成会失败的检查</title>
  <desc id="desc">三层机制全部来自 pi-mono 自己的原话：core is minimal 划定什么不进核心，Entry points are cost contracts 给入口设图预算并在提交时失败，Auto-closing creates a buffer 保护维护者时间；模糊的社会性约束被转写为可检查、可拒绝的边界。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#475569"/></marker>
  </defs>
  <rect width="1060" height="580" fill="#ffffff"/>
  <text x="530" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#172033">范围纪律与成本合同</text>
  <text x="530" y="62" text-anchor="middle" font-size="12" fill="#5f6b7a">三层的名字都是 pi-mono 的原话：core is minimal · Entry points are cost contracts · Auto-closing creates a buffer</text>

  <rect x="30" y="90" width="320" height="330" rx="8" fill="#edf5ff" stroke="#5791c9" stroke-width="1.5"/>
  <text x="190" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#173f67">范围纪律（v1.0.3 原话）</text>
  <text x="190" y="144" text-anchor="middle" font-size="11.5" font-weight="600" fill="#276da8">"pi's core is minimal"</text>
  <rect x="50" y="164" width="280" height="104" rx="6" fill="#ffffff" stroke="#8bb3d7"/>
  <text x="190" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#2f8550">约束</text>
  <text x="190" y="210" text-anchor="middle" font-size="10.5" fill="#526175">不属于 core 的能力应成 extension</text>
  <text x="190" y="230" text-anchor="middle" font-size="10.5" fill="#526175">膨胀 core 的 PR 大概率被拒</text>
  <text x="190" y="250" text-anchor="middle" font-size="10.5" fill="#526175">hook point 也要先讨论</text>
  <rect x="50" y="284" width="280" height="118" rx="6" fill="#ffffff" stroke="#8bb3d7"/>
  <text x="190" y="308" text-anchor="middle" font-size="11" font-weight="700" fill="#b3662a">边界</text>
  <text x="190" y="330" text-anchor="middle" font-size="10.5" fill="#526175">核心的维护负债由全体用户承担</text>
  <text x="190" y="350" text-anchor="middle" font-size="10.5" fill="#526175">扩展点地图是这条纪律的另一面</text>
  <text x="190" y="370" text-anchor="middle" font-size="10.5" fill="#526175">审阅判断发生在人，不在脚本</text>

  <rect x="370" y="90" width="320" height="330" rx="8" fill="#fff5e6" stroke="#d99939" stroke-width="1.5"/>
  <text x="530" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#744408">成本合同（v1.0.3 原话）</text>
  <text x="530" y="144" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b3662a">"Entry points are cost contracts"</text>
  <rect x="390" y="164" width="280" height="104" rx="6" fill="#ffffff" stroke="#d99939"/>
  <text x="530" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#2f8550">约束</text>
  <text x="530" y="210" text-anchor="middle" font-size="10.5" fill="#526175">每个列出入口有 maxFiles 预算</text>
  <text x="530" y="230" text-anchor="middle" font-size="10.5" fill="#526175">forbid 禁止触达的路径</text>
  <text x="530" y="250" text-anchor="middle" font-size="10.5" fill="#526175">只算 value import，type 被擦除</text>
  <rect x="390" y="284" width="280" height="118" rx="6" fill="#ffffff" stroke="#d99939"/>
  <text x="530" y="308" text-anchor="middle" font-size="11" font-weight="700" fill="#b3662a">边界</text>
  <text x="530" y="330" text-anchor="middle" font-size="10.5" fill="#526175">一次 export * 可拖约 37 MB 模块图</text>
  <text x="530" y="350" text-anchor="middle" font-size="10.5" fill="#526175">回归在提交时失败，而非生产被测出</text>
  <text x="530" y="370" text-anchor="middle" font-size="10.5" fill="#526175">未列出的入口不受预算约束</text>

  <rect x="710" y="90" width="320" height="330" rx="8" fill="#edf8f1" stroke="#55a36f" stroke-width="1.5"/>
  <text x="870" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6139">审阅缓冲（v1.0.3 原话）</text>
  <text x="870" y="144" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2f8550">"Auto-closing creates a buffer"</text>
  <rect x="730" y="164" width="280" height="104" rx="6" fill="#ffffff" stroke="#55a36f"/>
  <text x="870" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#2f8550">约束</text>
  <text x="870" y="210" text-anchor="middle" font-size="10.5" fill="#526175">新贡献者 issue/PR 默认自动关闭</text>
  <text x="870" y="230" text-anchor="middle" font-size="10.5" fill="#526175">lgtmi 解锁 issue · lgtm 解锁 issue+PR</text>
  <text x="870" y="250" text-anchor="middle" font-size="10.5" fill="#526175">issue 有独立质量门槛</text>
  <rect x="730" y="284" width="280" height="118" rx="6" fill="#ffffff" stroke="#55a36f"/>
  <text x="870" y="308" text-anchor="middle" font-size="11" font-weight="700" fill="#b3662a">边界</text>
  <text x="870" y="330" text-anchor="middle" font-size="10.5" fill="#526175">维护者按自己的节奏复审重开</text>
  <text x="870" y="350" text-anchor="middle" font-size="10.5" fill="#526175">低信号 issue 可无回复关闭</text>
  <text x="870" y="370" text-anchor="middle" font-size="10.5" fill="#526175">代价：对新贡献者不友好，仓库自担</text>

  <rect x="30" y="446" width="1000" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="530" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#27364a">共同的形态：把模糊的社会性约束转写为会失败的检查（本语料的观察归纳）</text>
  <text x="530" y="498" text-anchor="middle" font-size="11" fill="#526175">「请保持核心精简」是提醒，PR 被拒是机制；「维护者很忙」是提醒，默认关闭 + lgtm 解锁是机制</text>
  <text x="530" y="556" text-anchor="middle" font-size="11" fill="#5f6b7a">来源：earendil-works/pi v1.0.3 · CONTRIBUTING.md L7-L11 与 FAQ · scripts/check-entry-graphs.mjs L3-L12</text>
</svg>
