<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="700" fill="#0f172a">文档随包分发：自描述是「活文档」，agent 运行时够得到</text>

  <!-- loop: 4 nodes -->
  <rect x="30" y="100" width="150" height="70" rx="11" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="44" y="124" font-size="11.5" font-weight="700" fill="#115e59">① docs/ + examples/</text>
  <text x="44" y="142" font-size="10.5" fill="#134e4a">30+ 篇 docs</text>
  <text x="44" y="156" font-size="10.5" fill="#134e4a">70+ 可运行扩展</text>

  <line x1="180" y1="135" x2="232" y2="135" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="236" y="100" width="150" height="70" rx="11" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="250" y="124" font-size="11.5" font-weight="700" fill="#115e59">② 打进 npm 包</text>
  <text x="250" y="142" font-size="10.5" fill="#134e4a">package.json 的 files 字段</text>
  <text x="250" y="156" font-size="10.5" fill="#134e4a">含 docs、examples</text>

  <line x1="386" y1="135" x2="438" y2="135" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="442" y="100" width="150" height="70" rx="11" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="456" y="124" font-size="11.5" font-weight="700" fill="#115e59">③ prompt 指路</text>
  <text x="456" y="142" font-size="10.5" fill="#134e4a">文档地图给路径</text>
  <text x="456" y="156" font-size="10.5" fill="#134e4a">"resolve docs/..."</text>

  <line x1="592" y1="135" x2="628" y2="135" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="632" y="100" width="66" height="70" rx="11" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="642" y="124" font-size="11.5" font-weight="700" fill="#115e59">④</text>
  <text x="640" y="142" font-size="10.5" fill="#134e4a">agent</text>
  <text x="640" y="156" font-size="10.5" fill="#134e4a">read</text>

  <!-- back arrow -->
  <path d="M 665 200 C 665 250 60 250 105 175" fill="none" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="360" y="246" font-size="10.5" fill="#0f766e">按地图读，读完回填理解 —— 闭环</text>

  <!-- contrast -->
  <rect x="30" y="270" width="664" height="40" rx="9" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
  <text x="46" y="292" font-size="10.5" fill="#9a3412">对照：外链 wiki 是给人看的、agent 够不到；pi 的 docs 是给「上面跑的 agent」看的，且通过 prompt 主动指路。</text>

  <text x="20" y="60" font-size="11.5" font-weight="700" fill="#0f172a">四步闭环：写 docs → 打进包 → prompt 指路 → agent read</text>
</svg>
