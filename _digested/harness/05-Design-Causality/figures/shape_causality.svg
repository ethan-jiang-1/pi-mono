<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="700" fill="#0f172a">形状的因果:压力画像 + 生产方式 → 极简核 + 深扩展口 + library-first</text>

  <!-- causes -->
  <rect x="20" y="60" width="230" height="110" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="34" y="84" font-size="11.5" font-weight="700" fill="#1e3a8a">组合压力:嵌入型</text>
  <g font-size="10" fill="#1e3a8a">
    <text x="34" y="104">SDK 进程内(createAgentSession)</text>
    <text x="34" y="120">RPC 子进程 JSONL · TUI 终端</text>
    <text x="34" y="136">无多宿主 profile · 无运行时装卸</text>
    <text x="34" y="152">→ 嵌入方要背的运行时越少越好</text>
  </g>

  <rect x="20" y="186" width="230" height="96" rx="10" fill="#fefce8" stroke="#a16207" stroke-width="1.8"/>
  <text x="34" y="210" font-size="11.5" font-weight="700" fill="#854d0e">生产方式:人 + agent 共写</text>
  <g font-size="10" fill="#713f12">
    <text x="34" y="230">规则为人与 agent 都参与而写</text>
    <text x="34" y="246">(AGENTS.md 开篇明示)</text>
    <text x="34" y="262">review + CI 是瓶颈 → 怕的是</text>
    <text x="34" y="278">"每个功能都审一遍核心 PR"</text>
  </g>

  <line x1="250" y1="115" x2="296" y2="140" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="250" y1="230" x2="296" y2="200" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- shape -->
  <rect x="300" y="120" width="200" height="130" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.4"/>
  <text x="314" y="146" font-size="12.5" font-weight="700" fill="#115e59">pi 的形状</text>
  <g font-size="10.5" fill="#134e4a">
    <text x="314" y="170">极简核(CONTRIBUTING:7)</text>
    <text x="314" y="190">单一深扩展口(统一注入点)</text>
    <text x="314" y="210">library-first(README:15)</text>
    <text x="314" y="234">纪律 ↔ 形状互为因果</text>
  </g>

  <line x1="500" y1="160" x2="546" y2="140" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="500" y1="210" x2="546" y2="230" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- outcomes -->
  <rect x="550" y="96" width="210" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="564" y="120" font-size="10.5" font-weight="700" fill="#334155">结构读数</text>
  <text x="564" y="140" font-size="10" fill="#475569">8 内置工具 vs 70+ examples;</text>
  <text x="564" y="156" font-size="10" fill="#475569">编排面 = 内核单级 + 扩展补级</text>

  <rect x="550" y="186" width="210" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="564" y="210" font-size="10.5" font-weight="700" fill="#334155">v1.0.0 收缩 = 逻辑延续</text>
  <text x="564" y="230" font-size="10" fill="#475569">agent-core 只剩 Agent/loop/</text>
  <text x="564" y="246" font-size="10" fill="#475569">proxy/types;durable 接盘事实层</text>

  <!-- falsifier -->
  <line x1="400" y1="250" x2="400" y2="292" stroke="#475569" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowD)"/>
  <rect x="20" y="296" width="740" height="42" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="32" y="314" font-size="10" fill="#334155">可证伪观察:若 pi 走向多宿主(同一 spine 起多棵产品树、会话级装卸),现形状成本将超过收益 ——</text>
  <text x="32" y="330" font-size="10" fill="#334155">AgentLane/内层 harness 的反复(pi-agent-core 有 → 移出 → durable 承接)正是该压力尚未到位时的摇摆证据。</text>
</svg>
