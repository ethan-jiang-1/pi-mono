<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="700" fill="#0f172a">循环接缝（loop seam）：沿 agent loop 的拦截点（30+ 事件归纳成 7 个动作点）</text>

  <!-- seam nodes on the loop -->
  <g>
    <rect x="16" y="64" width="88" height="100" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <text x="60" y="86" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">input</text>
    <text x="60" y="106" font-size="9" fill="#475569" text-anchor="middle">transform</text>
    <text x="60" y="120" font-size="9" fill="#475569" text-anchor="middle">/ handled</text>
    <text x="60" y="150" font-size="8.5" fill="#94a3b8" text-anchor="middle">进循环前</text>

    <rect x="116" y="64" width="88" height="100" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <text x="160" y="86" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">before_</text>
    <text x="160" y="100" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">agent_start</text>
    <text x="160" y="120" font-size="9" fill="#475569" text-anchor="middle">注入消息</text>
    <text x="160" y="134" font-size="9" fill="#475569" text-anchor="middle">改 system prompt</text>
    <text x="160" y="152" font-size="8.5" fill="#94a3b8" text-anchor="middle">整轮起点</text>

    <rect x="216" y="64" width="88" height="100" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <text x="260" y="86" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">context</text>
    <text x="260" y="106" font-size="9" fill="#475569" text-anchor="middle">增删/改写</text>
    <text x="260" y="120" font-size="9" fill="#475569" text-anchor="middle">messages 数组</text>
    <text x="260" y="152" font-size="8.5" fill="#94a3b8" text-anchor="middle">每次 LLM 调用前</text>

    <rect x="316" y="64" width="88" height="100" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <text x="360" y="86" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">before_</text>
    <text x="360" y="100" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">provider_*</text>
    <text x="360" y="120" font-size="9" fill="#475569" text-anchor="middle">改 headers</text>
    <text x="360" y="134" font-size="9" fill="#475569" text-anchor="middle">/ payload</text>
    <text x="360" y="152" font-size="8.5" fill="#94a3b8" text-anchor="middle">请求发出前</text>

    <rect x="416" y="64" width="88" height="100" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/>
    <text x="460" y="86" font-size="10" font-weight="700" fill="#7f1d1d" text-anchor="middle">tool_call</text>
    <text x="460" y="106" font-size="9" fill="#7f1d1d" text-anchor="middle">block /</text>
    <text x="460" y="120" font-size="9" fill="#7f1d1d" text-anchor="middle">terminate</text>
    <text x="460" y="134" font-size="9" fill="#7f1d1d" text-anchor="middle">原地改参数</text>
    <text x="460" y="152" font-size="8.5" fill="#b91c1c" text-anchor="middle">权限关（fail-close）</text>

    <rect x="516" y="64" width="88" height="100" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <text x="560" y="86" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">tool_result</text>
    <text x="560" y="106" font-size="9" fill="#475569" text-anchor="middle">部分覆盖</text>
    <text x="560" y="120" font-size="9" fill="#475569" text-anchor="middle">content / details</text>
    <text x="560" y="152" font-size="8.5" fill="#94a3b8" text-anchor="middle">工具执行后</text>

    <rect x="616" y="64" width="88" height="100" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
    <text x="660" y="86" font-size="10" font-weight="700" fill="#7c2d12" text-anchor="middle">session_</text>
    <text x="660" y="100" font-size="10" font-weight="700" fill="#7c2d12" text-anchor="middle">before_compact</text>
    <text x="660" y="120" font-size="9" fill="#7c2d12" text-anchor="middle">换一套</text>
    <text x="660" y="134" font-size="9" fill="#7c2d12" text-anchor="middle">总结逻辑</text>
    <text x="660" y="152" font-size="8.5" fill="#c2410c" text-anchor="middle">整段记忆</text>
  </g>

  <!-- merge semantics -->
  <text x="20" y="190" font-size="12" font-weight="700" fill="#0f172a">四种合并语义（merge semantics）——每个接缝的"你能改什么、改完谁负责"</text>
  <g font-size="9.5">
    <rect x="16" y="202" width="160" height="58" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="28" y="222" font-weight="700" fill="#1e40af">chain 接力</text>
    <text x="28" y="238" fill="#1e40af">后见前值（context / systemPrompt）</text>
    <text x="28" y="252" fill="#64748b">多个扩展依次改写</text>

    <rect x="186" y="202" width="160" height="58" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.3"/>
    <text x="198" y="222" font-weight="700" fill="#14532d">merge 合并</text>
    <text x="198" y="238" fill="#14532d">各改各字段（tool_result）</text>
    <text x="198" y="252" fill="#64748b">合并收走，不互相覆盖</text>

    <rect x="356" y="202" width="160" height="58" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.3"/>
    <text x="368" y="222" font-weight="700" fill="#7f1d1d">short-circuit 短路</text>
    <text x="368" y="238" fill="#7f1d1d">首中即停（tool_call block）</text>
    <text x="368" y="252" fill="#64748b">cancel / handled 同理</text>

    <rect x="526" y="202" width="178" height="58" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.3"/>
    <text x="538" y="222" font-weight="700" fill="#581c87">mutate in place 原地改</text>
    <text x="538" y="238" fill="#581c87">headers / 工具参数，返回值被忽略</text>
    <text x="538" y="252" fill="#64748b">不换对象，只改字段</text>
  </g>

  <text x="20" y="292" font-size="10.5" fill="#64748b">接缝的位置 = 扩展的视野半径：input 影响一句话，context 影响每次调用，session_before_compact 影响整段记忆——选"最窄、副作用最小"的那条缝。</text>
</svg>
