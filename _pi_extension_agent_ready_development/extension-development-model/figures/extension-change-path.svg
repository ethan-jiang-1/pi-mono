<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <title id="title">一次扩展变更的完整路径：从外部结果到交付判断</title>
  <desc id="desc">七个步骤组成一次扩展变更的路径：定义外部结果、放进正确的资源类型、遵守生命周期合同、形成完整交付、按观察对象分层验证、干净安装验证、交付判断；一笔完整交付把实现、package 声明、README 与行为证据保持一致。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#475569"/></marker>
    <marker id="arrow-loop" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1120" height="600" fill="#ffffff"/>
  <text x="560" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#172033">一次扩展变更的完整路径</text>
  <text x="560" y="62" text-anchor="middle" font-size="12" fill="#5f6b7a">切片边界由用户行为决定，不由文件数量决定；顺序是组织方式，不是强制串行流程</text>

  <g text-anchor="middle">
    <rect x="30" y="96" width="250" height="104" rx="8" fill="#fff5e6" stroke="#d99939"/>
    <circle cx="60" cy="124" r="15" fill="#b3662a"/><text x="60" y="129" font-size="13" font-weight="700" fill="#ffffff">1</text>
    <text x="155" y="128" font-size="13" font-weight="700" fill="#744408">定义外部结果</text>
    <text x="155" y="152" font-size="10.5" fill="#805915">触发条件 · 用户看到什么</text>
    <text x="155" y="170" font-size="10.5" fill="#805915">失败行为 · 完成条件</text>

    <rect x="300" y="96" width="250" height="104" rx="8" fill="#edf5ff" stroke="#5791c9"/>
    <circle cx="330" cy="124" r="15" fill="#276da8"/><text x="330" y="129" font-size="13" font-weight="700" fill="#ffffff">2</text>
    <text x="425" y="128" font-size="13" font-weight="700" fill="#173f67">放进正确的资源</text>
    <text x="425" y="152" font-size="10.5" fill="#526175">扩展 · skill · template · package</text>
    <text x="425" y="170" font-size="10.5" fill="#526175">每类事实有权威位置</text>

    <rect x="570" y="96" width="250" height="104" rx="8" fill="#f3efff" stroke="#8269bd"/>
    <circle cx="600" cy="124" r="15" fill="#6950a4"/><text x="600" y="129" font-size="13" font-weight="700" fill="#ffffff">3</text>
    <text x="695" y="128" font-size="13" font-weight="700" fill="#513b85">生命周期合同</text>
    <text x="695" y="152" font-size="10.5" fill="#526175">factory 只注册 · settled 边界</text>
    <text x="695" y="170" font-size="10.5" fill="#526175">幂等 session_shutdown</text>

    <rect x="840" y="96" width="250" height="104" rx="8" fill="#eaf7f6" stroke="#3b9a91"/>
    <circle cx="870" cy="124" r="15" fill="#237a72"/><text x="870" y="129" font-size="13" font-weight="700" fill="#ffffff">4</text>
    <text x="965" y="128" font-size="13" font-weight="700" fill="#1d5f59">完整交付</text>
    <text x="965" y="152" font-size="10.5" fill="#526175">实现 + package 声明</text>
    <text x="965" y="170" font-size="10.5" fill="#526175">+ README + 行为证据</text>

    <rect x="840" y="260" width="250" height="104" rx="8" fill="#edf8f1" stroke="#55a36f"/>
    <circle cx="870" cy="288" r="15" fill="#2f8550"/><text x="870" y="293" font-size="13" font-weight="700" fill="#ffffff">5</text>
    <text x="965" y="292" font-size="13" font-weight="700" fill="#1f6139">分层验证</text>
    <text x="965" y="316" font-size="10.5" fill="#526175">faux 断言 · 真实交互</text>
    <text x="965" y="334" font-size="10.5" fill="#526175">每层只证明它观察的对象</text>

    <rect x="570" y="260" width="250" height="104" rx="8" fill="#fff5e6" stroke="#d99939"/>
    <circle cx="600" cy="288" r="15" fill="#b3662a"/><text x="600" y="293" font-size="13" font-weight="700" fill="#ffffff">6</text>
    <text x="695" y="292" font-size="13" font-weight="700" fill="#744408">干净安装验证</text>
    <text x="695" y="316" font-size="10.5" fill="#805915">pi install 到干净 agent dir</text>
    <text x="695" y="334" font-size="10.5" fill="#805915">复验可观察行为</text>

    <rect x="300" y="260" width="250" height="104" rx="8" fill="#edf5ff" stroke="#5791c9"/>
    <circle cx="330" cy="288" r="15" fill="#276da8"/><text x="330" y="293" font-size="13" font-weight="700" fill="#ffffff">7</text>
    <text x="425" y="292" font-size="13" font-weight="700" fill="#173f67">交付判断</text>
    <text x="425" y="316" font-size="10.5" fill="#526175">外部结果 · 影响面</text>
    <text x="425" y="334" font-size="10.5" fill="#526175">实际验证 · 明确未验证项</text>
  </g>

  <path d="M280 148 H296" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M550 148 H566" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M820 148 H836" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M965 200 V256" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M836 312 H824" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M566 312 H554" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M300 312 H280 V226" stroke="#64748b" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-loop)"/>
  <text x="150" y="272" font-size="10" fill="#64748b">下一笔变更重新从外部结果开始</text>

  <rect x="60" y="420" width="1000" height="96" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="560" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#27364a">一笔完整交付保持一致的东西</text>
  <rect x="100" y="466" width="216" height="38" rx="7" fill="#edf5ff" stroke="#8bb3d7"/><text x="208" y="490" text-anchor="middle" font-size="11" fill="#244e73">实现：源码与类型</text>
  <rect x="336" y="466" width="216" height="38" rx="7" fill="#fff5e6" stroke="#d99939"/><text x="444" y="490" text-anchor="middle" font-size="11" fill="#744408">package 声明：manifest 与依赖</text>
  <rect x="572" y="466" width="216" height="38" rx="7" fill="#edf8f1" stroke="#55a36f"/><text x="680" y="490" text-anchor="middle" font-size="11" fill="#1f6139">用户文档：当前用法</text>
  <rect x="808" y="466" width="216" height="38" rx="7" fill="#f3efff" stroke="#8269bd"/><text x="916" y="490" text-anchor="middle" font-size="11" fill="#513b85">行为证据：回归会失败</text>

  <text x="560" y="556" text-anchor="middle" font-size="11" fill="#5f6b7a">来源：综合自 earendil-works/pi v1.0.3 · extensions.md 生命周期与工具合同 · packages.md 安装合同</text>
</svg>
