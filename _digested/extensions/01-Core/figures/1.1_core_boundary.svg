<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="700" fill="#0f172a">核有多小：三件事留在核里，四类东西被赶出去</text>

  <!-- core box -->
  <rect x="30" y="64" width="280" height="190" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="44" y="88" font-size="12.5" font-weight="700" fill="#1e3a8a">核（core）——只留三件事</text>
  <text x="44" y="114" font-size="11" fill="#1e40af">① agent loop：跑循环的引擎</text>
  <text x="44" y="134" font-size="11" fill="#1e40af">② 7 原子工具：</text>
  <text x="56" y="152" font-size="10.5" fill="#1e40af">read / bash / edit / write /</text>
  <text x="56" y="168" font-size="10.5" fill="#1e40af">grep / find / ls</text>
  <text x="44" y="192" font-size="11" fill="#1e40af">③ 挂扩展的骨架：</text>
  <text x="56" y="210" font-size="10.5" fill="#1e40af">ExtensionAPI + 接缝（seam）</text>
  <text x="44" y="236" font-size="10.5" fill="#64748b">原子动作的价值不依赖偏好</text>

  <!-- pushed-out box -->
  <rect x="360" y="64" width="330" height="190" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="374" y="88" font-size="12.5" font-weight="700" fill="#0f172a">被赶出去 → 扩展（extension）</text>
  <text x="374" y="112" font-size="10.5" fill="#334155">工作流 workflow：plan-mode · subagent ·</text>
  <text x="386" y="128" font-size="10.5" fill="#334155">todo · preset · git-checkpoint</text>
  <text x="374" y="150" font-size="10.5" fill="#334155">护栏 guard：permission-gate · protected-paths</text>
  <text x="374" y="170" font-size="10.5" fill="#334155">长相 presentation：minimal-mode · footer · snake</text>
  <text x="374" y="190" font-size="10.5" fill="#334155">后端接入 backend：custom-provider · ssh ·</text>
  <text x="386" y="206" font-size="10.5" fill="#334155">sandbox · gondolin</text>
  <text x="374" y="236" font-size="10.5" fill="#64748b">偏好 / 工作流 / 接入 —— 价值依赖偏好</text>

  <!-- same-seam arrow -->
  <line x1="312" y1="150" x2="356" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="140" font-size="10" fill="#64748b" text-anchor="middle">同一个</text>
  <text x="300" y="176" font-size="10" fill="#64748b" text-anchor="middle">接缝</text>

  <!-- bottom note -->
  <rect x="30" y="272" width="660" height="44" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="46" y="292" font-size="11.5" font-weight="700" fill="#4c1d95">7 内置 vs 70+ 扩展 = core-minimal 纪律执行后的比例</text>
  <text x="46" y="308" font-size="11" fill="#4c1d95">两边走的是同一个 pi 对象（一个工厂函数）——被赶出去 ≠ 进不去，只是不占核。</text>
</svg>
