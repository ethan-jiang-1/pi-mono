<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <text x="20" y="28" font-size="15" font-weight="700" fill="#0f172a">Pi 的参与知识载体：机器检查、文档与参与者判断相互补充</text>
  <rect x="20" y="56" width="540" height="82" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="34" y="80" font-size="12" font-weight="700" fill="#115e59">可执行层 — 检查与测试</text>
  <g font-size="11" fill="#134e4a">
    <text x="34" y="100">lint / typecheck / 依赖 / 模块图 / install-lock / 贡献门</text>
    <text x="34" y="116">examples 的类型约束；部分检查有拒绝负例回归</text>
    <text x="34" y="132">也限制部分参与方式，但不能证明所有语义正确</text>
  </g>
  <rect x="572" y="72" width="164" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
  <text x="584" y="94" font-size="11" font-weight="700" fill="#14532d">验证特定合同</text>
  <text x="584" y="110" font-size="10" fill="#166534">不是全面保真</text>
  <rect x="20" y="152" width="540" height="82" rx="10" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="34" y="176" font-size="12" font-weight="700" fill="#854d0e">可读层 — 规则、docs 与 examples</text>
  <g font-size="11" fill="#713f12">
    <text x="34" y="196">CONTRIBUTING / AGENTS / docs / RFC / 作者自述 / 范本</text>
    <text x="34" y="212">多数 examples 参加类型检查；gondolin 是明确排除项</text>
    <text x="34" y="228">类型兼容不等于运行正确；散文语义仍需核对实现</text>
  </g>
  <rect x="572" y="168" width="164" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.4"/>
  <text x="584" y="190" font-size="11" font-weight="700" fill="#854d0e">解释与示范</text>
  <text x="584" y="206" font-size="10" fill="#a16207">与检查共同使用</text>
  <rect x="20" y="248" width="540" height="70" rx="10" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/>
  <text x="34" y="272" font-size="12" font-weight="700" fill="#831843">判断层 — 合同之外仍需理解与 review</text>
  <g font-size="11" fill="#831843">
    <text x="34" y="292">能力是否属于 core、扩展组合语义、威胁模型与维护取舍</text>
    <text x="34" y="308">已有文字规则不能移除所有判断；也不是所有知识都未外置</text>
  </g>
  <rect x="572" y="258" width="164" height="50" rx="8" fill="#ffe4e6" stroke="#be123c" stroke-width="1.4"/>
  <text x="584" y="280" font-size="11" font-weight="700" fill="#9f1239">人的责任</text>
  <text x="584" y="296" font-size="10" fill="#be123c">理解、审计、维护</text>
  <rect x="20" y="330" width="716" height="30" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="32" y="349" font-size="11" fill="#991b1b">负知识已有外置，但分散在文档与作者自述；未核到统一、机器校验的被否方案总表。</text>
</svg>
