<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="700" fill="#0f172a">长相（presentation）：execute 与 render 是两个正交的 slot（槽位）</text>

  <!-- tool with two slots -->
  <rect x="30" y="52" width="660" height="96" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="46" y="74" font-size="12" font-weight="700" fill="#0f172a">一个工具（tool）——两个独立的 slot，缺省继承内置</text>

  <rect x="46" y="86" width="306" height="48" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="60" y="106" font-size="11" font-weight="700" fill="#4c1d95">execute slot —— 行为（behavior）</text>
  <text x="60" y="124" font-size="10" fill="#6b21a8">execute(id, params, signal, onUpdate)</text>

  <rect x="368" y="86" width="306" height="48" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="382" y="106" font-size="11" font-weight="700" fill="#14532d">render slot —— 长相（presentation）</text>
  <text x="382" y="124" font-size="10" fill="#166534">renderCall / renderResult</text>

  <!-- example rows -->
  <rect x="30" y="172" width="660" height="48" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
  <text x="46" y="192" font-size="11.5" font-weight="700" fill="#7f1d1d">tool-override.ts：只覆盖 execute</text>
  <text x="46" y="210" font-size="10.5" fill="#7f1d1d">加日志 + 拦敏感路径 → 没写 render，自动继承内置（高亮、行号、截断提示）</text>

  <rect x="30" y="228" width="660" height="48" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.4"/>
  <text x="46" y="248" font-size="11.5" font-weight="700" fill="#14532d">minimal-mode.ts：只覆盖 render</text>
  <text x="46" y="266" font-size="10.5" fill="#14532d">折叠时只显示工具名 → execute 原样转发 createReadTool(cwd).execute，行为零改动</text>

  <text x="20" y="298" font-size="10.5" fill="#64748b">两个 slot 正交（orthogonal）：改长相不碰数据路径，改行为不碰渲染——"包装内置工具"不必重写。</text>
</svg>
