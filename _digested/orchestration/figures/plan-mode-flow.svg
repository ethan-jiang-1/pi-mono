<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="arrowX" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="15" font-weight="700" fill="#0f172a">plan-mode 扩展:计划 → 人工批准 → [DONE:n] 执行(纯扩展 API)</text>

  <!-- normal -->
  <rect x="20" y="60" width="110" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="34" y="84" font-size="11" font-weight="700" fill="#334155">普通模式</text>
  <text x="34" y="102" font-size="9.5" fill="#64748b">全量工具面</text>

  <line x1="130" y1="88" x2="168" y2="88" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="126" y="78" font-size="9" fill="#0f766e">/plan · Ctrl+Alt+P · --plan</text>

  <!-- plan mode -->
  <rect x="172" y="52" width="200" height="100" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="186" y="74" font-size="11.5" font-weight="700" fill="#115e59">计划模式(只读探索)</text>
  <g font-size="10" fill="#134e4a">
    <text x="186" y="94">setActiveTools 摘 edit/write</text>
    <text x="186" y="110">bash 只读 allowlist(tool_call block)</text>
    <text x="186" y="126">before_agent_start 注入</text>
    <text x="186" y="142">[PLAN MODE ACTIVE] → 产出 Plan: 1..n</text>
  </g>

  <line x1="372" y1="88" x2="410" y2="88" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- extraction -->
  <rect x="414" y="60" width="130" height="56" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="426" y="84" font-size="10.5" font-weight="700" fill="#115e59">agent_end</text>
  <text x="426" y="102" font-size="9.5" fill="#334155">提取编号步骤为 todos</text>

  <line x1="544" y1="88" x2="582" y2="88" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- approval gate -->
  <rect x="586" y="46" width="192" height="86" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="600" y="70" font-size="11.5" font-weight="700" fill="#14532d">ctx.ui.select(人工批准)</text>
  <g font-size="10" fill="#166534">
    <text x="600" y="90">① Execute the plan</text>
    <text x="600" y="106">② Stay in plan mode</text>
    <text x="600" y="122">③ Refine the plan(editor)</text>
  </g>
  <text x="586" y="150" font-size="9.5" fill="#15803d">批准权在人,不在模型</text>

  <!-- execute branch -->
  <path d="M 682 132 C 682 190 500 200 430 208" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrowG)"/>
  <text x="500" y="192" font-size="9.5" fill="#166534">Execute → 恢复工具面</text>

  <rect x="250" y="188" width="180" height="96" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="264" y="210" font-size="11.5" font-weight="700" fill="#1e3a8a">执行模式</text>
  <g font-size="10" fill="#1e3a8a">
    <text x="264" y="230">followUp 注入剩余步骤 + 协议</text>
    <text x="264" y="246">turn_end 解析 [DONE:n] 更新进度</text>
    <text x="264" y="262">状态 appendEntry 持久;</text>
    <text x="264" y="278">resume 重扫执行标记后重建</text>
  </g>

  <!-- loop arrow -->
  <path d="M 250 236 C 190 236 190 210 246 210" fill="none" stroke="#1d4ed8" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowG)"/>
  <text x="176" y="222" font-size="9" fill="#1d4ed8">逐步推进</text>

  <!-- completion -->
  <path d="M 430 250 C 480 250 500 268 520 296" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrowG)"/>
  <rect x="524" y="298" width="150" height="46" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="538" y="318" font-size="10.5" font-weight="700" fill="#14532d">Plan Complete ✓</text>
  <text x="538" y="334" font-size="9.5" fill="#166534">清状态防 resume 复活</text>

  <!-- stay/refine back -->
  <path d="M 600 132 C 560 160 300 168 190 156 C 120 148 90 130 92 110" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="212" y="164" font-size="9" fill="#64748b">Stay / Refine → 留在或回到计划模式</text>

  <!-- bottom note -->
  <rect x="20" y="356" width="758" height="34" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="32" y="372" font-size="10" fill="#991b1b">用到的扩展面:setActiveTools · on(tool_call/context/before_agent_start/turn_end/agent_end/session_start) · sendMessage(deliverAs:"followUp") · appendEntry —— 没有任何 core 改动。</text>
  <text x="560" y="386" font-size="9" fill="#b91c1c">对照:plan-mode/index.ts 全文 390 行</text>
</svg>
