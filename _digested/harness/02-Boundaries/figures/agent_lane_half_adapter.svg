<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="700" fill="#0f172a">AgentLane：契约画齐了，实现还是骨架（唯一 consumer 也是 stub）</text>

  <!-- contract (rich) -->
  <rect x="30" y="58" width="320" height="150" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="46" y="82" font-size="12.5" font-weight="700" fill="#14532d">契约（画得很齐）agent-harness.ts</text>
  <text x="46" y="104" font-size="11" fill="#166534">ActionInfo：14 种操作</text>
  <text x="46" y="120" font-size="11" fill="#166534">  append_entry / move_lane / stream_assistant</text>
  <text x="46" y="136" font-size="11" fill="#166534">  execute_tool / hook / sleep…</text>
  <text x="46" y="156" font-size="11" fill="#166534">HookName：11 个钩子（before_run / transform_context</text>
  <text x="46" y="172" font-size="11" fill="#166534">  / before_tool / after_tool / before_compaction…）</text>
  <text x="46" y="192" font-size="11" fill="#166534">AgentHarnessOptions：drive: automatic|manual 等全配置面</text>

  <!-- implementation (skeleton) -->
  <rect x="370" y="58" width="322" height="150" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="386" y="82" font-size="12.5" font-weight="700" fill="#7f1d1d">实现（大多抛错）</text>
  <text x="386" y="104" font-size="11" fill="#991b1b">UnavailableRegistry.on()：</text>
  <text x="386" y="120" font-size="11" fill="#991b1b">  任何 hook 注册都 throw HarnessNotImplemented</text>
  <text x="386" y="144" font-size="11" fill="#991b1b">多数操作路径抛 HarnessNotImplemented。</text>
  <text x="386" y="168" font-size="11" fill="#7f1d1d">→ 契约的丰富 与 实现的空 并存于同一个文件。</text>

  <!-- one and a half adapter -->
  <text x="30" y="242" font-size="12.5" font-weight="700" fill="#0f172a">真 seam 检验：一个半 adapter</text>
  <rect x="30" y="254" width="300" height="46" rx="9" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="44" y="272" font-size="11" font-weight="700" fill="#4c1d95">adapter 1（成熟）：coding-agent 的 AgentSession</text>
  <text x="44" y="288" font-size="10.5" fill="#6b21a8">createAgentSession() → 真正能跑的那条路</text>
  <rect x="350" y="254" width="300" height="46" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="364" y="272" font-size="11" font-weight="700" fill="#64748b">adapter 2（缺）：外部宿主直用 AgentLane</text>
  <text x="364" y="288" font-size="10.5" fill="#94a3b8">自组运行时 —— 还没成型</text>

  <text x="20" y="320" font-size="10.5" fill="#64748b">一个 adapter = 假想 seam；两个 = 真 seam。AgentLane 处在一个半的尴尬位置 → library-first 是「方向 + 契约」，不是现状。</text>
</svg>
