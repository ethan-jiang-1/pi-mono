<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
  </defs>
  <text x="20" y="28" font-size="15" font-weight="700" fill="#0f172a">Pi 形状的约束：原生动机、维护纪律与可嵌入性共同作用</text>
  <rect x="20" y="60" width="230" height="110" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="34" y="84" font-size="12" font-weight="700" fill="#1e3a8a">作者动机与多种宿主入口</text>
  <g font-size="11" fill="#1e3a8a">
    <text x="34" y="104">简单、可预测、上下文可控</text>
    <text x="34" y="122">检查交互、构建替代 UI</text>
    <text x="34" y="140">SDK / RPC / print / TUI</text>
    <text x="34" y="158">嵌入是约束之一，不是唯一原因</text>
  </g>
  <rect x="20" y="186" width="230" height="96" rx="10" fill="#fefce8" stroke="#a16207" stroke-width="1.8"/>
  <text x="34" y="210" font-size="12" font-weight="700" fill="#854d0e">治理合同与维护约束</text>
  <g font-size="11" fill="#713f12">
    <text x="34" y="230">CONTRIBUTING：core-minimal</text>
    <text x="34" y="248">贡献者须理解代码</text>
    <text x="34" y="266">hook 也要讨论复杂交互与维护</text>
  </g>
  <line x1="250" y1="115" x2="296" y2="140" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="250" y1="230" x2="296" y2="200" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="300" y="120" width="200" height="130" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.4"/>
  <text x="314" y="146" font-size="13" font-weight="700" fill="#115e59">当前结构与解释</text>
  <g font-size="11" fill="#134e4a">
    <text x="314" y="170">核心责任克制</text>
    <text x="314" y="190">扩展提供变化入口</text>
    <text x="314" y="210">宿主可通过库 / RPC 驱动</text>
    <text x="314" y="234">不证明所有设计单因导出</text>
  </g>
  <line x1="500" y1="160" x2="546" y2="140" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="500" y1="210" x2="546" y2="230" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="550" y="96" width="210" height="70" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="564" y="120" font-size="12" font-weight="700" fill="#334155">职责边界</text>
  <text x="564" y="140" font-size="11" fill="#475569">loop / 应用会话 / durable</text>
  <text x="564" y="156" font-size="11" fill="#475569">不是一个持久化模型</text>
  <rect x="550" y="186" width="210" height="70" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="564" y="210" font-size="12" font-weight="700" fill="#334155">仍需评估的成本</text>
  <text x="564" y="230" font-size="11" fill="#475569">组合、升级、权限、维护</text>
  <text x="564" y="246" font-size="11" fill="#475569">小接口 ≠ 永久兼容</text>
  <rect x="20" y="296" width="740" height="42" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="32" y="314" font-size="11" fill="#334155">观察与解释分开：职责迁移与核心克制相容，但不证明唯一历史原因。</text>
  <text x="32" y="331" font-size="11" fill="#334155">未来装配能力的成本与收益应测量；不能预先断言多宿主或运行时替换一定不划算。</text>
</svg>
