<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="arrowX" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="700" fill="#0f172a">贡献门：把「评审时间」当稀缺资源治理（默认值从开翻成关）</text>

  <!-- flow -->
  <rect x="30" y="70" width="150" height="54" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="44" y="92" font-size="11.5" font-weight="700" fill="#334155">issue / PR opened</text>
  <text x="44" y="108" font-size="10.5" fill="#64748b">（新贡献者）</text>

  <line x1="182" y1="97" x2="228" y2="97" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="232" y="70" width="160" height="54" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="246" y="92" font-size="11.5" font-weight="700" fill="#7f1d1d">auto-close（默认）</text>
  <text x="246" y="108" font-size="10.5" fill="#991b1b">workflow 脚本强制</text>

  <line x1="312" y1="124" x2="312" y2="160" stroke="#64748b" stroke-width="1.4"/>
  <line x1="312" y1="160" x2="160" y2="160" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrowX)"/>
  <text x="150" y="154" font-size="10.5" fill="#dc2626">低信号 → 永久封号 / 无视</text>

  <line x1="312" y1="160" x2="470" y2="160" stroke="#15803d" stroke-width="1.4" marker-end="url(#arrowG)"/>

  <rect x="474" y="130" width="200" height="60" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="488" y="152" font-size="11.5" font-weight="700" fill="#1e3a8a">维护者每日复查 → reopen</text>
  <text x="488" y="170" font-size="10.5" fill="#1e40af">值得的才 reopen，人工兜底</text>

  <!-- escalation -->
  <line x1="574" y1="190" x2="574" y2="214" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="474" y="218" width="200" height="60" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="488" y="240" font-size="11.5" font-weight="700" fill="#14532d">分级信任（lgtmi → lgtm）</text>
  <text x="488" y="258" font-size="10.5" fill="#166534">lgtmi：issue 放行（仍不能发 PR）</text>
  <text x="488" y="274" font-size="10.5" fill="#166534">lgtm：issue + PR 都放行</text>

  <!-- quality bar -->
  <rect x="30" y="236" width="400" height="84" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="46" y="258" font-size="11.5" font-weight="700" fill="#0f172a">质量线（issue 要够短、够具体）</text>
  <text x="46" y="278" font-size="10.5" fill="#334155">• 一屏内 · 自己写（不许 LLM 代写，代写须标注）</text>
  <text x="46" y="294" font-size="10.5" fill="#334155">• 说清 bug/需求 + 为什么重要</text>
  <text x="46" y="310" font-size="10.5" fill="#334155">• 刷票 / 大量自动化 issue → 永久封号</text>

  <text x="452" y="296" font-size="10.5" fill="#64748b">针对 AI 时代 tracker 洪水，</text>
  <text x="452" y="312" font-size="10.5" fill="#64748b">不是传统「行为准则」。</text>
</svg>
