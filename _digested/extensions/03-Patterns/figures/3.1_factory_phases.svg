<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="700" fill="#0f172a">一个工厂函数（factory function）：注册期 / 运行期两个阶段</text>

  <!-- factory -->
  <rect x="30" y="76" width="150" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="105" y="102" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="middle">export default</text>
  <text x="105" y="118" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="middle">function (pi) {}</text>
  <text x="105" y="136" font-size="9" fill="#6b21a8" text-anchor="middle">加载时执行一次</text>

  <line x1="182" y1="111" x2="218" y2="111" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- registration phase -->
  <rect x="222" y="52" width="210" height="118" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="236" y="74" font-size="12" font-weight="700" fill="#1e3a8a">注册期 registration phase</text>
  <text x="236" y="96" font-size="10.5" fill="#1e40af">· pi.registerTool() / on(...)</text>
  <text x="236" y="114" font-size="10.5" fill="#1e40af">· registerCommand / Shortcut / Flag</text>
  <text x="236" y="132" font-size="10.5" fill="#1e40af">· registerProvider()</text>
  <text x="236" y="156" font-size="10" fill="#64748b">动作：声明"我要什么"</text>

  <line x1="434" y1="111" x2="470" y2="111" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- runtime phase -->
  <rect x="474" y="52" width="216" height="118" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="488" y="74" font-size="12" font-weight="700" fill="#14532d">运行期 runtime phase</text>
  <text x="488" y="96" font-size="10.5" fill="#166534">· tool_call 拦截回调</text>
  <text x="488" y="114" font-size="10.5" fill="#166534">· before_agent_start 回调</text>
  <text x="488" y="132" font-size="10.5" fill="#166534">· command / shortcut handler</text>
  <text x="488" y="156" font-size="10" fill="#64748b">动作：响应"发生了什么"</text>

  <!-- bottom note -->
  <rect x="30" y="206" width="660" height="52" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="46" y="226" font-size="11.5" font-weight="700" fill="#0f172a">async 工厂：pi 会 await 它再继续启动</text>
  <text x="46" y="244" font-size="11" fill="#334155">fetch 模型目录这类异步初始化，在 session_start / resources_discover / provider flush 之前完成（见 custom-provider 示例）。</text>
</svg>
