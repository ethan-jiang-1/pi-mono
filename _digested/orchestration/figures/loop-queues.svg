<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="15" font-weight="700" fill="#0f172a">Agent 内核:两条注入队列 + 内外双环(agent-loop.ts:163-321)</text>

  <!-- queues -->
  <rect x="20" y="60" width="150" height="84" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="32" y="82" font-size="11.5" font-weight="700" fill="#1e3a8a">steeringQueue</text>
  <text x="32" y="100" font-size="10" fill="#1e3a8a">turn 间注入,不砍工作</text>
  <text x="32" y="116" font-size="10" fill="#1e3a8a">QueueMode: all |</text>
  <text x="32" y="130" font-size="10" fill="#1e3a8a">one-at-a-time(默认)</text>

  <rect x="20" y="250" width="150" height="70" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="32" y="272" font-size="11.5" font-weight="700" fill="#4c1d95">followUpQueue</text>
  <text x="32" y="290" font-size="10" fill="#4c1d95">仅当 agent 即将停止</text>
  <text x="32" y="306" font-size="10" fill="#4c1d95">时接管(外环)</text>

  <!-- inner loop -->
  <rect x="230" y="52" width="320" height="212" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="244" y="76" font-size="12" font-weight="700" fill="#115e59">内环 while (hasToolCalls || pending)</text>
  <g font-size="10.5" fill="#134e4a">
    <rect x="248" y="90" width="284" height="26" rx="6" fill="#ffffff" stroke="#99f6e4"/>
    <text x="256" y="107">① 起点 poll steering(:175)</text>
    <rect x="248" y="124" width="284" height="26" rx="6" fill="#ffffff" stroke="#99f6e4"/>
    <text x="256" y="141">prepareNextTurn(可长跑,如 compaction)</text>
    <rect x="248" y="158" width="284" height="26" rx="6" fill="#ffffff" stroke="#99f6e4"/>
    <text x="256" y="175">② 长准备后再 poll(:201) → prepareRequest</text>
    <rect x="248" y="192" width="284" height="26" rx="6" fill="#ffffff" stroke="#99f6e4"/>
    <text x="256" y="209">stream assistant → 执行工具(parallel|sequential)</text>
    <rect x="248" y="226" width="284" height="26" rx="6" fill="#ffffff" stroke="#99f6e4"/>
    <text x="256" y="243">③ turn 后 poll(:295) → finishTurn 裁决</text>
  </g>

  <!-- steering arrows -->
  <line x1="170" y1="90" x2="244" y2="100" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arrowB)"/>
  <line x1="170" y1="110" x2="244" y2="170" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arrowB)"/>
  <line x1="170" y1="128" x2="244" y2="238" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arrowB)"/>

  <!-- outer loop -->
  <rect x="590" y="60" width="170" height="150" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <text x="602" y="82" font-size="11.5" font-weight="700" fill="#115e59">外环(:301-314)</text>
  <g font-size="10" fill="#334155">
    <text x="602" y="102">agent 将停 → 查 followUp</text>
    <text x="602" y="118">有 → 置 pending 续内环</text>
    <text x="602" y="140">finishTurn 曾 continue</text>
    <text x="602" y="156">→ 一次纯上下文 turn</text>
    <text x="602" y="178">错误 / aborted:</text>
    <text x="602" y="194">永远硬退出(:245)</text>
  </g>
  <line x1="550" y1="140" x2="590" y2="140" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 675 210 C 675 260 470 290 400 264" fill="none" stroke="#6d28d9" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="470" y="292" font-size="10" fill="#6d28d9">followUp 接管</text>

  <!-- finishTurn exit -->
  <line x1="390" y1="264" x2="390" y2="308" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="322" font-size="10.5" fill="#334155">finishTurn {action:"end"} → agent_end;waitForIdle 等 agent_end 监听器落定</text>

  <!-- abort -->
  <line x1="230" y1="36" x2="560" y2="36" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowR)"/>
  <text x="236" y="30" font-size="10" fill="#dc2626">abort():AbortController 贯穿流式与工具执行;运行中再 prompt() → 报错并指路 steer()/followUp()</text>

  <!-- bottom note -->
  <rect x="20" y="336" width="740" height="42" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="1.2"/>
  <text x="32" y="354" font-size="10.5" fill="#713f12">工具失败不炸环:throw / block / 校验失败一律 isError 结果回模型,重试是模型的动作(runToolCall 让嵌套调用走同一钩子链)。</text>
  <text x="32" y="370" font-size="10.5" fill="#713f12">stopReason "length" → 该消息全部 tool call 判失败(截断参数可能看似合法实则不完整)。</text>
</svg>
