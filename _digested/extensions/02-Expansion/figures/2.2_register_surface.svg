<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="700" fill="#0f172a">注册面（register surface）：一个工厂函数 → register* 全家桶 → 谁消费</text>

  <!-- factory -->
  <rect x="30" y="128" width="140" height="64" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="100" y="152" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="middle">export default</text>
  <text x="100" y="168" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="middle">function (pi) {}</text>
  <text x="100" y="184" font-size="9" fill="#6b21a8" text-anchor="middle">工厂函数（加载时执行）</text>

  <line x1="172" y1="160" x2="208" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- registers -->
  <g>
    <rect x="212" y="52" width="170" height="30" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
    <text x="224" y="71" font-size="10.5" font-weight="700" fill="#334155">pi.registerTool()</text>
    <rect x="212" y="90" width="170" height="30" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
    <text x="224" y="109" font-size="10.5" font-weight="700" fill="#334155">pi.registerCommand()</text>
    <rect x="212" y="128" width="170" height="30" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
    <text x="224" y="147" font-size="10.5" font-weight="700" fill="#334155">registerShortcut / Flag</text>
    <rect x="212" y="166" width="170" height="30" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
    <text x="224" y="185" font-size="10.5" font-weight="700" fill="#334155">pi.registerProvider()</text>
    <rect x="212" y="204" width="170" height="30" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
    <text x="224" y="223" font-size="10.5" font-weight="700" fill="#334155">resources_discover 事件</text>
  </g>

  <line x1="384" y1="160" x2="420" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- consumers -->
  <rect x="424" y="52" width="266" height="196" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="438" y="74" font-size="12" font-weight="700" fill="#0f172a">谁消费</text>
  <text x="438" y="98" font-size="10.5" fill="#334155">· LLM —— 工具（进 system prompt）</text>
  <text x="438" y="120" font-size="10.5" fill="#334155">· 用户（TUI / RPC）—— /命令</text>
  <text x="438" y="142" font-size="10.5" fill="#334155">· 按键 / 启动参数 —— 快捷键 / flag</text>
  <text x="438" y="164" font-size="10.5" fill="#334155">· ModelRegistry —— provider</text>
  <text x="438" y="186" font-size="10.5" fill="#334155">· 资源加载器 —— skill / prompt / theme</text>
  <text x="438" y="214" font-size="10" fill="#64748b">注册 = 声明存在；</text>
  <text x="438" y="228" font-size="10" fill="#64748b">激活（setActiveTools）才是"这次可用"</text>

  <!-- bottom note -->
  <rect x="30" y="272" width="660" height="44" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="46" y="292" font-size="11.5" font-weight="700" fill="#1e3a8a">同权（first-class）</text>
  <text x="46" y="308" font-size="11" fill="#1e3a8a">注册进来的东西和内置走同一条注册链、同一套生命周期——扩展工具不是二等公民。</text>
</svg>
