<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #334155; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .grid-char { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #1e293b; }
    </style>
    <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12"/>

  <!-- Header -->
  <text x="40" y="42" class="title">VirtualTerminal 无头终端字符栅格测试架构</text>
  <text x="40" y="66" class="subtitle">放弃 Vitest 改用 node:test · 基于 @xterm/headless 的 ANSI 逃逸流清洗与二维视口断言</text>

  <!-- Box 1: Component Input & ANSI Emission -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="250" height="385" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="250" height="40" rx="10" fill="#f1f5f9"/>
    <path d="M 0 30 L 250 30 L 250 40 L 0 40 Z" fill="#f1f5f9"/>
    <text x="16" y="25" class="box-title" fill="#334155">1. TUI 组件与 ANSI 逃逸流</text>

    <g transform="translate(14, 52)">
      <rect width="222" height="70" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="10" y="20" class="text-body" font-weight="600">待测终端交互组件</text>
      <text x="10" y="38" class="text-code" fill="#64748b">Editor, SelectList, Overlay</text>
      <text x="10" y="54" class="text-code" fill="#64748b">tui-alt-screen, status-bar</text>
    </g>

    <g transform="translate(14, 134)">
      <rect width="222" height="135" rx="6" fill="#fef2f2" stroke="#fee2e2"/>
      <text x="10" y="20" class="text-body" font-weight="600" fill="#991b1b">高污染的原生 ANSI 输出</text>
      <text x="10" y="40" class="text-code" fill="#b91c1c">\x1b[31m (红色颜色切换)</text>
      <text x="10" y="58" class="text-code" fill="#b91c1c">\x1b[10;20H (光标二维跳跃)</text>
      <text x="10" y="76" class="text-code" fill="#b91c1c">\x1b[?2004h (括号粘贴模式)</text>
      <text x="10" y="94" class="text-code" fill="#b91c1c">\x1b[2J\x1b[H (清屏并回原点)</text>
      <text x="10" y="118" class="text-body" font-size="11px" fill="#7f1d1d">若直接对比字符串，极易全面崩溃</text>
    </g>

    <g transform="translate(14, 280)">
      <rect width="222" height="85" rx="6" fill="#eff6ff" stroke="#dbeafe"/>
      <text x="10" y="20" class="text-body" font-weight="600" fill="#1d4ed8">模拟击键注入 (sendInput)</text>
      <text x="10" y="40" class="text-code" fill="#1e40af">terminal.sendInput("hello\r")</text>
      <text x="10" y="58" class="text-code" fill="#1e40af">terminal.sendInput("\x1b[A")</text>
      <text x="10" y="74" class="text-body" font-size="11px" fill="#1e40af">模拟方向键、回车与快捷键</text>
    </g>
  </g>

  <!-- Flow Arrow 1 to 2 -->
  <line x1="290" y1="260" x2="330" y2="260" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Box 2: VirtualTerminal Engine -->
  <g transform="translate(335, 95)" filter="url(#shadow)">
    <rect width="300" height="385" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <rect width="300" height="40" rx="10" fill="#f0f9ff"/>
    <path d="M 0 30 L 300 30 L 300 40 L 0 40 Z" fill="#f0f9ff"/>
    <text x="16" y="25" class="box-title" fill="#0369a1">2. VirtualTerminal 内存解析引擎</text>

    <!-- Simulated Terminal Grid -->
    <g transform="translate(16, 52)">
      <text x="0" y="16" class="text-body" font-weight="600">80x24 视口内存字符矩阵 (Buffer)</text>
      
      <!-- Visual Matrix Preview -->
      <g transform="translate(0, 26)">
        <rect width="268" height="150" rx="6" fill="#0f172a"/>
        
        <!-- Grid Content -->
        <text x="12" y="24" class="grid-char" fill="#38bdf8">&gt; pi prompt: select option</text>
        <text x="12" y="46" class="grid-char" fill="#4ade80">  [x] 1. Approve changes</text>
        <text x="12" y="68" class="grid-char" fill="#94a3b8">  [ ] 2. Reject and fork</text>
        <text x="12" y="90" class="grid-char" fill="#94a3b8">  [ ] 3. Cancel task</text>
        <line x1="12" y1="102" x2="256" y2="102" stroke="#334155" stroke-dasharray="2"/>
        <text x="12" y="122" class="grid-char" fill="#facc15">Cursor at: (x: 6, y: 1)  [█]</text>
        <text x="12" y="138" class="text-code" fill="#64748b" font-size="9px">xterm.buffer.active.viewportY + i</text>
      </g>
    </g>

    <g transform="translate(16, 245)">
      <rect width="268" height="120" rx="6" fill="#f0fdf4" stroke="#dcfce7"/>
      <text x="10" y="20" class="text-body" font-weight="600" fill="#166534">样式洗脱算法 (translateToString)</text>
      <text x="10" y="42" class="text-code" fill="#15803d">const line = buffer.getLine(row);</text>
      <text x="10" y="60" class="text-code" fill="#15803d">line.translateToString(true);</text>
      <text x="10" y="82" class="text-body" font-size="11px" fill="#14532d">彻底剥除所有 ANSI 色彩与光标码</text>
      <text x="10" y="100" class="text-body" font-size="11px" fill="#14532d">精准保留人类肉眼所见的纯净字符</text>
    </g>
  </g>

  <!-- Flow Arrow 2 to 3 -->
  <line x1="635" y1="260" x2="675" y2="260" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Box 3: Deterministic Semantic Assertions -->
  <g transform="translate(680, 95)" filter="url(#shadow)">
    <rect width="240" height="385" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect width="240" height="40" rx="10" fill="#f0fdf4"/>
    <path d="M 0 30 L 240 30 L 240 40 L 0 40 Z" fill="#f0fdf4"/>
    <text x="16" y="25" class="box-title" fill="#166534">3. 确定性语义断言接口</text>

    <g transform="translate(14, 52)">
      <rect width="212" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="10" y="20" class="text-body" font-weight="600">屏幕文本行断言</text>
      <text x="10" y="40" class="text-code" fill="#0369a1">terminal.getViewport()</text>
      <text x="10" y="58" class="text-code" fill="#0f766e">expect(lines[1]).toContain(</text>
      <text x="10" y="70" class="text-code" fill="#0f766e">  "[x] 1. Approve"</text>
    </g>

    <g transform="translate(14, 137)">
      <rect width="212" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="10" y="20" class="text-body" font-weight="600">光标物理坐标断言</text>
      <text x="10" y="40" class="text-code" fill="#0369a1">terminal.getCursorPosition()</text>
      <text x="10" y="58" class="text-code" fill="#0f766e">expect(cursor).toEqual(</text>
      <text x="10" y="70" class="text-code" fill="#0f766e">  { x: 6, y: 1 })</text>
    </g>

    <g transform="translate(14, 222)">
      <rect width="212" height="143" rx="6" fill="#fdf4ff" stroke="#f0abfc"/>
      <text x="10" y="20" class="text-body" font-weight="600" fill="#86198f">为什么用 node:test？</text>
      <text x="10" y="40" class="text-body" font-size="11px" fill="#701a75">1. Vitest 多线程沙箱会重写</text>
      <text x="14" y="56" class="text-body" font-size="11px" fill="#701a75">   process.stdout 与事件循环</text>
      <text x="10" y="74" class="text-body" font-size="11px" fill="#701a75">2. 导致 TTY 与窗口大小变更</text>
      <text x="14" y="90" class="text-body" font-size="11px" fill="#701a75">   (SIGWINCH) 时序倒置</text>
      <text x="10" y="108" class="text-body" font-size="11px" fill="#701a75">3. 原生 node:test 单用例</text>
      <text x="14" y="124" class="text-body" font-size="11px" fill="#701a75">   数毫秒跑完，0 环境污染</text>
    </g>
  </g>
</svg>
