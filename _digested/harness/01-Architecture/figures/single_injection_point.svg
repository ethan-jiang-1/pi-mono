<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="700" fill="#0f172a">统一注入点：一个口子进，多种能力出</text>

  <!-- capability types on the left -->
  <text x="30" y="66" font-size="11.5" font-weight="700" fill="#475569">能力类型（全走一个口子）</text>
  <g font-size="11" fill="#1e293b">
    <rect x="30" y="78" width="150" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="42" y="95">tool（registerTool）</text>
    <rect x="30" y="110" width="150" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="42" y="127">slash command</text>
    <rect x="30" y="142" width="150" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="42" y="159">shortcut / CLI flag</text>
    <rect x="30" y="174" width="150" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="42" y="191">provider（registerProvider）</text>
    <rect x="30" y="206" width="150" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="42" y="223">system prompt 修改</text>
    <rect x="30" y="238" width="150" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="42" y="255">UI / 消息注入</text>
  </g>

  <!-- arrows converging to the single point -->
  <g stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)">
    <line x1="180" y1="91" x2="252" y2="150"/>
    <line x1="180" y1="123" x2="252" y2="152"/>
    <line x1="180" y1="155" x2="252" y2="154"/>
    <line x1="180" y1="187" x2="252" y2="156"/>
    <line x1="180" y1="219" x2="252" y2="158"/>
    <line x1="180" y1="251" x2="252" y2="160"/>
  </g>

  <!-- single injection point -->
  <rect x="254" y="132" width="180" height="56" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="268" y="156" font-size="13" font-weight="700" fill="#4c1d95">ExtensionAPI（唯一口子）</text>
  <text x="268" y="172" font-size="10.5" fill="#6b21a8">jiti 加载 + 事件扇出 + 生命周期</text>

  <!-- what's written once -->
  <rect x="470" y="88" width="224" height="144" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="484" y="112" font-size="12" font-weight="700" fill="#0f172a">写一次，处处覆盖</text>
  <text x="484" y="132" font-size="11" fill="#334155">• bindCore（两阶段绑定）</text>
  <text x="484" y="150" font-size="11" fill="#334155">• invalidate（stale 保护）</text>
  <text x="484" y="168" font-size="11" fill="#334155">• 错误隔离 + fail-close 例外</text>
  <text x="484" y="190" font-size="10.5" fill="#64748b">多协议 harness 要每协议重做一遍。</text>
  <text x="484" y="206" font-size="10.5" fill="#64748b">→ 这是统一口子的 locality 收益。</text>

  <line x1="434" y1="160" x2="468" y2="160" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- cost note at bottom -->
  <rect x="30" y="282" width="664" height="44" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="46" y="302" font-size="11.5" font-weight="700" fill="#7f1d1d">代价（必须记账）</text>
  <text x="46" y="318" font-size="11" fill="#7f1d1d">生态锁定：没有 MCP/ACP 旁路（见 2.2）。统一口子 = 低认知成本 + 深可扩展，换横向互操作弱。</text>
</svg>
