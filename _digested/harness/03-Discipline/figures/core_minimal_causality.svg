<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="700" fill="#0f172a">core-minimal：可扩展性不是架构天赋，是被纪律逼出来的</text>

  <!-- causal chain -->
  <rect x="30" y="70" width="180" height="96" rx="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="44" y="94" font-size="12" font-weight="700" fill="#1e3a8a">① 纪律</text>
  <text x="44" y="114" font-size="10.5" fill="#1e40af">「pi's core is minimal」</text>
  <text x="44" y="130" font-size="10.5" fill="#1e40af">不该进 core 的必须是扩展，</text>
  <text x="44" y="146" font-size="10.5" fill="#1e40af">连 hook 点都要审。</text>

  <line x1="212" y1="118" x2="256" y2="118" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="260" y="70" width="180" height="96" rx="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="274" y="94" font-size="12" font-weight="700" fill="#1e3a8a">② 能力被逼到扩展面</text>
  <text x="274" y="114" font-size="10.5" fill="#1e40af">功能无处安放，</text>
  <text x="274" y="130" font-size="10.5" fill="#1e40af">只能在边界外开接缝。</text>
  <text x="274" y="146" font-size="10.5" fill="#1e40af">内置 7 vs 扩展 70+。</text>

  <line x1="442" y1="118" x2="486" y2="118" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="490" y="70" width="200" height="96" rx="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="504" y="94" font-size="12" font-weight="700" fill="#1e3a8a">③ 接缝被逼到「深」</text>
  <text x="504" y="114" font-size="10.5" fill="#1e40af">三层接缝（1.1）+ 护栏（1.4）</text>
  <text x="504" y="130" font-size="10.5" fill="#1e40af">接缝要够深够稳，</text>
  <text x="504" y="146" font-size="10.5" fill="#1e40af">否则扩展面变第二个 core。</text>

  <!-- reverse implication -->
  <rect x="30" y="196" width="660" height="84" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="46" y="218" font-size="11.5" font-weight="700" fill="#0f172a">反向验证</text>
  <text x="46" y="238" font-size="11" fill="#334155">没有 core-minimal 纪律，扩展面就是可选、装饰性的，永远不会被逼到「深度」——todo / plan-mode / git-checkpoint</text>
  <text x="46" y="254" font-size="11" fill="#334155">这些能力早就被塞进内置工具，而不是现在这样全部做成扩展。</text>
  <text x="46" y="270" font-size="11" fill="#334155">→ 纪律（core minimal）是「结构优秀（01）」的机制保障，不是巧合。</text>
</svg>
