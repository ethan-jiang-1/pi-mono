<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #334155; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; }
    </style>
    <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12"/>

  <!-- Header -->
  <text x="40" y="42" class="title">Pi-mono 契约证据锁与发布消费验证体系</text>
  <text x="40" y="66" class="subtitle">MCP 官方套件 baseline.json 防退化锁 · 本地物理 Tarball 隔离安装与跨端消费冒烟</text>

  <!-- Section 1: MCP Conformance Evidence Lock -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="880" height="180" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <rect width="880" height="38" rx="10" fill="#f0f9ff"/>
    <path d="M 0 28 L 880 28 L 880 38 L 0 38 Z" fill="#f0f9ff"/>
    <text x="18" y="24" class="box-title" fill="#0369a1">1. Model Context Protocol (MCP) 金标合规证据锁 (Golden Baseline Lock)</text>

    <!-- Flow: Runner -> Diff Engine -> 4 Outcomes -->
    <g transform="translate(18, 50)">
      <!-- Box A: Run Suite -->
      <rect x="0" y="8" width="220" height="102" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="28" class="text-body" font-weight="600">调度官方 MCP 合规套件</text>
      <text x="12" y="46" class="text-code" fill="#0284c7">npm run test:mcp-conformance</text>
      <text x="12" y="66" class="text-body" font-size="11px" fill="#64748b">覆盖三代协议矩阵版本：</text>
      <text x="12" y="82" class="text-code" fill="#0f766e" font-size="10px">2025-03-26, 06-18, 11-25</text>
      <text x="12" y="98" class="text-body" font-size="11px" fill="#64748b">自动化跑通握手与 OAuth 流程</text>

      <!-- Arrow -->
      <line x1="225" y1="58" x2="265" y2="58" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>

      <!-- Box B: Diff with baseline.json -->
      <rect x="270" y="8" width="230" height="102" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="12" y="28" class="text-body" font-weight="600" fill="#166534">与已提交的 baseline.json 对比</text>
      <text x="12" y="48" class="text-code" fill="#15803d">Diff checks.json vs baseline</text>
      <text x="12" y="68" class="text-body" font-size="11px">允许接纳已知局限 (Known limits)</text>
      <text x="12" y="86" class="text-body" font-size="11px">如：暂不支持 elicitation-sep1034</text>
      <text x="12" y="102" class="text-body" font-size="11px" font-weight="600" fill="#15803d">严密防退化 (Regression Shield)</text>

      <!-- Arrow -->
      <line x1="505" y1="58" x2="545" y2="58" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>

      <!-- Box C: 4 Strict Gate Decisions -->
      <g transform="translate(550, 0)">
        <rect x="0" y="0" width="295" height="26" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="8" y="17" class="badge" fill="#991b1b">🔴 判定 1: 基线通过的项挂了 ──► 【立刻熔断 PR】</text>

        <rect x="0" y="30" width="295" height="26" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="8" y="47" class="badge" fill="#991b1b">🔴 判定 2: 出现基线未记录的新失败 ──► 【立刻熔断】</text>

        <rect x="0" y="60" width="295" height="26" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="8" y="77" class="badge" fill="#991b1b">🔴 判定 3: 基线声明的场景未执行 ──► 【立刻熔断】</text>

        <rect x="0" y="90" width="295" height="26" rx="4" fill="#dcfce7" stroke="#86efac"/>
        <text x="8" y="107" class="badge" fill="#166534">🟢 判定 4: 修复使原失败项通过 ──► 【锁定新基线】</text>
      </g>
    </g>
  </g>

  <!-- Section 2: Tarball Consumer Smoke Testing -->
  <g transform="translate(40, 295)" filter="url(#shadow)">
    <rect width="880" height="185" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect width="880" height="38" rx="10" fill="#f0fdf4"/>
    <path d="M 0 28 L 880 28 L 880 38 L 0 38 Z" fill="#f0fdf4"/>
    <text x="18" y="24" class="box-title" fill="#166534">2. 发布包真实消费者打包冒烟 (Tarball Consumer Smoke: check-package-install.mjs)</text>

    <g transform="translate(18, 50)">
      <!-- Step 1: npm pack -->
      <rect x="0" y="8" width="185" height="106" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="10" y="26" class="text-body" font-weight="600">1. 本地物理打包</text>
      <text x="10" y="44" class="text-code" fill="#0284c7">npm pack</text>
      <text x="10" y="60" class="text-code" fill="#64748b">--ignore-scripts</text>
      <text x="10" y="78" class="text-body" font-size="11px">生成全部发布包真实</text>
      <text x="10" y="96" class="text-code" fill="#16a34a">.tgz 归档文件</text>

      <line x1="190" y1="60" x2="225" y2="60" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

      <!-- Step 2: Isolation Consumer -->
      <rect x="230" y="8" width="195" height="106" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="10" y="26" class="text-body" font-weight="600">2. 宿主隔离工程</text>
      <text x="10" y="44" class="text-code" fill="#0284c7">/tmp/pi-consumer-*/</text>
      <text x="10" y="62" class="text-body" font-size="11px">写入独立 package.json</text>
      <text x="10" y="80" class="text-body" font-size="11px">使用真实包管理器安装：</text>
      <text x="10" y="98" class="text-code" fill="#16a34a">npm install / bun install</text>

      <line x1="430" y1="60" x2="465" y2="60" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

      <!-- Step 3: Package Integrity Check -->
      <rect x="470" y="8" width="190" height="106" rx="6" fill="#fef2f2" stroke="#fee2e2"/>
      <text x="10" y="26" class="text-body" font-weight="600" fill="#991b1b">3. 严禁黑货泄漏</text>
      <text x="10" y="44" class="text-code" fill="#b91c1c">dist/client (Forbidden)</text>
      <text x="10" y="60" class="text-code" fill="#b91c1c">dist/experimental (...)</text>
      <text x="10" y="78" class="text-body" font-size="11px" fill="#7f1d1d">物理核查解包文件树</text>
      <text x="10" y="96" class="text-body" font-size="11px" fill="#7f1d1d">绝不打包开发态代码</text>

      <line x1="665" y1="60" x2="700" y2="60" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

      <!-- Step 4: Consumer SDK & CLI -->
      <rect x="705" y="8" width="140" height="106" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="10" y="26" class="text-body" font-weight="600" fill="#166534">4. 外部视角验收</text>
      <text x="10" y="44" class="text-code" fill="#15803d">smoke-sdk.mjs</text>
      <text x="10" y="60" class="text-body" font-size="11px">import 核心类</text>
      <text x="10" y="78" class="text-code" fill="#15803d">pi --version</text>
      <text x="10" y="96" class="text-body" font-size="11px">核对版本字符串</text>
    </g>
  </g>
</svg>
