<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="700" fill="#0f172a">安全护栏（safety guard）：三道护栏兜住"挂第三方代码"，是"敢挂"的前提</text>

  <!-- guard 1 -->
  <rect x="30" y="60" width="210" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="44" y="84" font-size="12" font-weight="700" fill="#0f172a">护栏 1：两阶段绑定</text>
  <text x="44" y="104" font-size="10" fill="#334155">two-phase binding</text>
  <text x="44" y="126" font-size="10" fill="#334155">加载期的 registerProvider 只进</text>
  <text x="44" y="140" font-size="10" fill="#334155">pending 队列，bindCore() 时</text>
  <text x="44" y="154" font-size="10" fill="#334155">flush 到 ModelRegistry。</text>
  <text x="44" y="176" font-size="9.5" fill="#64748b">→ 注册顺序无关，时序被核吞掉</text>
  <text x="44" y="192" font-size="9.5" fill="#64748b">（custom-provider 工厂里直接注册）</text>

  <!-- guard 2 -->
  <rect x="255" y="60" width="210" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="269" y="84" font-size="12" font-weight="700" fill="#0f172a">护栏 2：stale 保护</text>
  <text x="269" y="104" font-size="10" fill="#334155">stale-context guard</text>
  <text x="269" y="126" font-size="10" fill="#334155">session 切换 / fork / reload 后，</text>
  <text x="269" y="140" font-size="10" fill="#334155">旧 ctx 被打 stale 标记，</text>
  <text x="269" y="154" font-size="10" fill="#334155">invalidate() / assertActive()</text>
  <text x="269" y="168" font-size="10" fill="#334155">抛带指引的错误。</text>
  <text x="269" y="192" font-size="9.5" fill="#64748b">→ 静默损坏变显式报错</text>

  <!-- guard 3 -->
  <rect x="480" y="60" width="210" height="150" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
  <text x="494" y="84" font-size="12" font-weight="700" fill="#7c2d12">护栏 3：fail-close</text>
  <text x="494" y="104" font-size="10" fill="#7c2d12">fail-closed（权限关例外）</text>
  <text x="494" y="126" font-size="10" fill="#7c2d12">普通 emit* 都 try-catch 隔离，</text>
  <text x="494" y="140" font-size="10" fill="#7c2d12">唯独 emitToolCall 故意不吞</text>
  <text x="494" y="154" font-size="10" fill="#7c2d12">异常——权限钩子崩溃</text>
  <text x="494" y="168" font-size="10" fill="#7c2d12">= 工具被拦（保守），</text>
  <text x="494" y="182" font-size="10" fill="#7c2d12">不是静默放行。</text>
  <text x="494" y="202" font-size="9.5" fill="#9a3412">→ 错误隔离是有方向的</text>

  <!-- bottom note -->
  <rect x="30" y="236" width="660" height="76" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="46" y="258" font-size="11.5" font-weight="700" fill="#4c1d95">写一次、覆盖所有能力类型（tool / command / provider / renderer …）</text>
  <text x="46" y="278" font-size="11" fill="#4c1d95">扩展以完整系统权限运行任意 TS 代码——"靠扩展长能力"的可信度取决于这三道护栏，而非扩展数量。</text>
  <text x="46" y="296" font-size="10.5" fill="#6b21a8">机制细节见 agent/1.4（两阶段绑定）与 agent/4.4（emitToolCall 无 try-catch 的例外）。</text>
</svg>
