<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .tier-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 13px; }
      .tier-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #1e293b; }
      .tier-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #475569; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #0f766e; }
      .time-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; }
    </style>
    <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12"/>

  <!-- Header -->
  <text x="40" y="42" class="title">Pi-mono 五级测试金字塔与九重工程门禁矩阵</text>
  <text x="40" y="66" class="subtitle">分轨驱动、物理隔离、成本预算与按需唤醒的层级治理体系</text>

  <!-- Tier 5: Evals & Live E2E -->
  <g transform="translate(180, 95)" filter="url(#shadow)">
    <rect width="600" height="62" rx="8" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
    <rect width="80" height="62" rx="8" fill="#fef2f2"/>
    <path d="M 80 0 L 80 62 L 70 62 L 70 0 Z" fill="#fef2f2"/>
    <text x="22" y="36" class="tier-tag" fill="#dc2626">Tier 5</text>
    <text x="96" y="26" class="tier-title">真实云端 E2E 与独立模型评测 (Live E2E &amp; Evals)</text>
    <text x="96" y="48" class="tier-desc">packages/evals/ (vitest.evals.config.ts) · 真实付费模型 · 默认休眠 · 仅定时/按需触发</text>
    <rect x="580" y="20" width="85" height="22" rx="4" fill="#fee2e2"/>
    <text x="592" y="35" class="time-badge" fill="#991b1b">~5m / 串行</text>
  </g>

  <!-- Tier 4: Smoke & Tmux -->
  <g transform="translate(140, 168)" filter="url(#shadow)">
    <rect width="680" height="62" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <rect width="80" height="62" rx="8" fill="#fff7ed"/>
    <path d="M 80 0 L 80 62 L 70 62 L 70 0 Z" fill="#fff7ed"/>
    <text x="22" y="36" class="tier-tag" fill="#ea580c">Tier 4</text>
    <text x="96" y="26" class="tier-title">单体独立二进制冒烟与 Tmux 受控录制 (Smoke &amp; Binary)</text>
    <text x="96" y="48" class="tier-desc">scripts/smoke-test-*.mjs (本地 50 行微型 SSE 服务) · tmux 80x24 虚拟屏幕快照验证打包完整性</text>
    <rect x="660" y="20" width="85" height="22" rx="4" fill="#ffedd5"/>
    <text x="677" y="35" class="time-badge" fill="#9a3412">~15s / 独立</text>
  </g>

  <!-- Tier 3: Harness & Faux -->
  <g transform="translate(100, 241)" filter="url(#shadow)">
    <rect width="760" height="62" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect width="80" height="62" rx="8" fill="#f0fdf4"/>
    <path d="M 80 0 L 80 62 L 70 62 L 70 0 Z" fill="#f0fdf4"/>
    <text x="22" y="36" class="tier-tag" fill="#16a34a">Tier 3</text>
    <text x="96" y="26" class="tier-title">Harness 会话状态机仿真与扩展集成 (Integration &amp; Agent Loop)</text>
    <text x="96" y="48" class="tier-desc">packages/coding-agent/test/suite/harness.ts · 710行 faux.ts 剧本队列 · 全真 AgentSession 0 Token 驱动</text>
    <rect x="740" y="20" width="85" height="22" rx="4" fill="#dcfce7"/>
    <text x="758" y="35" class="time-badge" fill="#166534">~10s / 全量</text>
  </g>

  <!-- Tier 2: Unit & Component -->
  <g transform="translate(60, 314)" filter="url(#shadow)">
    <rect width="840" height="62" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <rect width="80" height="62" rx="8" fill="#f0f9ff"/>
    <path d="M 80 0 L 80 62 L 70 62 L 70 0 Z" fill="#f0f9ff"/>
    <text x="22" y="36" class="tier-tag" fill="#0284c7">Tier 2</text>
    <text x="96" y="26" class="tier-title">纯逻辑单测与组件无头字符网格 (Unit &amp; Headless Component)</text>
    <text x="96" y="48" class="tier-desc">12 个子包由 Vitest 快速编译测试 · packages/tui 独占采用 Node 原生 node:test 引擎 (VirtualTerminal)</text>
    <rect x="820" y="20" width="85" height="22" rx="4" fill="#e0f2fe"/>
    <text x="838" y="35" class="time-badge" fill="#0369a1">~1s / 极速</text>
  </g>

  <!-- Tier 1: Static & 9 Gates -->
  <g transform="translate(20, 387)" filter="url(#shadow)">
    <rect width="920" height="135" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <rect width="80" height="135" rx="8" fill="#eef2ff"/>
    <path d="M 80 0 L 80 135 L 70 135 L 70 0 Z" fill="#eef2ff"/>
    <text x="22" y="72" class="tier-tag" fill="#4f46e5">Tier 1</text>
    <text x="96" y="25" class="tier-title">静态编译与九重工程守卫门禁 (Static &amp; Engineering Gate: npm run check)</text>
    <text x="96" y="44" class="tier-desc">提交与合并的绝对阻断线：零 errors, 零 warnings, 零 infos · 涵盖 AST 语法、依赖拓扑与模块图预算</text>
    
    <!-- 9 Sub-gates Grid -->
    <g transform="translate(96, 56)">
      <rect x="0" y="0" width="250" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="8" y="15" class="text-code">1. Biome 严格格式与 Lint 检查</text>

      <rect x="260" y="0" width="250" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="268" y="15" class="text-code">2. check-pinned-deps 固定外部版本</text>

      <rect x="520" y="0" width="280" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="528" y="15" class="text-code">3. check-runtime-deps AST 幽灵依赖(#9132)</text>

      <rect x="0" y="26" width="250" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="8" y="41" class="text-code">4. check-entry-graphs 模块图预算</text>

      <rect x="260" y="26" width="250" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="268" y="41" class="text-code">5. check-ts-imports 相对路径合法性</text>

      <rect x="520" y="26" width="280" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="528" y="41" class="text-code">6. check:install-lock 安装锁+脚本审计</text>

      <rect x="0" y="52" width="250" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="8" y="67" class="text-code">7. npm-audit.mjs 显式豁免(CI)</text>

      <rect x="260" y="52" width="250" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="268" y="67" class="text-code">8. tsc --noEmit 擦除语法与无 any</text>

      <rect x="520" y="52" width="280" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="528" y="67" class="text-code">9. check-browser-smoke esbuild 跨端冒烟</text>
    </g>

    <rect x="820" y="20" width="85" height="22" rx="4" fill="#e0e7ff"/>
    <text x="838" y="35" class="time-badge" fill="#3730a3">~3s / 必跑</text>
  </g>
</svg>
