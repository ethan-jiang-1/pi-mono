<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowX" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="700" fill="#0f172a">无 MCP/ACP：统一注入点的另一面是生态锁定</text>

  <!-- pi ecosystem (closed loop) -->
  <rect x="30" y="60" width="320" height="220" rx="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="46" y="84" font-size="12.5" font-weight="700" fill="#4c1d95">pi 扩展生态（闭环）</text>

  <rect x="46" y="96" width="130" height="34" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="56" y="117" font-size="10.5" fill="#1e293b">registerTool</text>
  <rect x="190" y="96" width="130" height="34" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="200" y="117" font-size="10.5" fill="#1e293b">subagent（扩展实现）</text>
  <rect x="46" y="140" width="130" height="34" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="56" y="161" font-size="10.5" fill="#1e293b">registerProvider</text>
  <rect x="190" y="140" width="130" height="34" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="200" y="161" font-size="10.5" fill="#1e293b">自定义 UI / 事件</text>

  <text x="46" y="200" font-size="10.5" fill="#6b21a8">全部从 ExtensionAPI 这个口子进。</text>
  <text x="46" y="216" font-size="10.5" fill="#6b21a8">能力不缺，缺的是互操作。</text>
  <text x="46" y="236" font-size="10.5" fill="#6b21a8">subagent 是「用我的扩展」长出来的，</text>
  <text x="46" y="252" font-size="10.5" fill="#6b21a8">不是外部协议。</text>

  <!-- external MCP ecosystem -->
  <rect x="400" y="60" width="292" height="130" rx="14" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="416" y="84" font-size="12.5" font-weight="700" fill="#713f12">外部 MCP/ACP 生态（现成 server）</text>
  <text x="416" y="106" font-size="10.5" fill="#854d0e">GitHub / filesystem / 数据库…</text>
  <text x="416" y="122" font-size="10.5" fill="#854d0e">几千个现成 MCP server。</text>
  <text x="416" y="142" font-size="10.5" fill="#854d0e">pi 一个都不能即插即用。</text>

  <!-- broken bridge -->
  <line x1="352" y1="150" x2="398" y2="150" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="362" y="170" font-size="11" font-weight="700" fill="#dc2626">✗ 无桥</text>

  <!-- adapter tax -->
  <rect x="400" y="210" width="292" height="70" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="416" y="232" font-size="11.5" font-weight="700" fill="#7c2d12">适配层税</text>
  <text x="416" y="250" font-size="10.5" fill="#9a3412">每个 MCP server 进 pi，都要写一个 extension</text>
  <text x="416" y="265" font-size="10.5" fill="#9a3412">适配层（起 MCP client → 逐个 registerTool 转接）。</text>

  <text x="20" y="304" font-size="10.5" fill="#64748b">结论：可辩护的取舍（低认知成本换横向互操作弱），但要说清这是「天花板」不是「功能缺失」。</text>
</svg>
