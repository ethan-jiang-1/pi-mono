<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="15" font-weight="700" fill="#0f172a">durable 任务状态机:状态只能经 commit 改变,图是派生投影</text>

  <!-- states -->
  <g font-size="11" font-weight="700">
    <rect x="24" y="90" width="96" height="44" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
    <text x="52" y="117" fill="#334155">pending</text>
    <rect x="160" y="90" width="96" height="44" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
    <text x="188" y="117" fill="#1e3a8a">running</text>
    <rect x="296" y="76" width="170" height="72" rx="9" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="310" y="100" fill="#115e59">waiting</text>
    <text x="310" y="118" font-size="9.5" font-weight="400" fill="#134e4a">on: [childTaskId…]</text>
    <text x="310" y="134" font-size="9.5" font-weight="400" fill="#134e4a">policy: allSettled | failFast</text>
    <rect x="506" y="90" width="110" height="44" rx="9" fill="#fefce8" stroke="#a16207" stroke-width="1.6"/>
    <text x="526" y="117" fill="#854d0e">completing</text>
    <rect x="656" y="90" width="100" height="44" rx="9" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/>
    <text x="678" y="117" fill="#4c1d95">terminal</text>
  </g>
  <line x1="120" y1="112" x2="156" y2="112" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="256" y1="112" x2="292" y2="112" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="466" y1="112" x2="502" y2="112" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="616" y1="112" x2="652" y2="112" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="526" y="152" font-size="9" fill="#a16207">outcome 已定,等 owned work 清空</text>
  <text x="660" y="152" font-size="9" fill="#6d28d9">离开图(task-graph.ts:163)</text>

  <!-- restart note -->
  <path d="M 208 90 C 208 62 260 62 300 74" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="216" y="56" font-size="9.5" fill="#64748b">重启后:running 显示为 pending(图上是已提交状态,不是推测)</text>

  <!-- abort -->
  <path d="M 340 148 C 340 190 200 190 130 138" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowR)"/>
  <text x="150" y="205" font-size="10" fill="#dc2626">abort 自底向上:先 abort 拥有的工作,自己的 abort handler 等其结束后才跑</text>

  <!-- three notes -->
  <rect x="24" y="232" width="232" height="76" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="36" y="254" font-size="10.5" font-weight="700" fill="#1e3a8a">owned conversation(subagent)</text>
  <text x="36" y="272" font-size="9.5" fill="#1e3a8a">replay:"safe" + ownership 索引:</text>
  <text x="36" y="288" font-size="9.5" fill="#1e3a8a">崩溃重跑找到同一个孩子,</text>
  <text x="36" y="300" font-size="9.5" fill="#1e3a8a">不再起一个</text>

  <rect x="274" y="232" width="232" height="76" rx="9" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
  <text x="286" y="254" font-size="10.5" font-weight="700" fill="#115e59">background: true = 隔离边界</text>
  <text x="286" y="272" font-size="9.5" fill="#134e4a">它拥有的工作在父 abort 后存活,</text>
  <text x="286" y="288" font-size="9.5" fill="#134e4a">也不让父保持 busy;</text>
  <text x="286" y="300" font-size="9.5" fill="#134e4a">父的 idle 以孩子 idle 为前提(前台)</text>

  <rect x="524" y="232" width="232" height="76" rx="9" fill="#fdf2f8" stroke="#be185d" stroke-width="1.4"/>
  <text x="536" y="254" font-size="10.5" font-weight="700" fill="#831843">TaskGraph = 派生投影</text>
  <text x="536" y="272" font-size="9.5" fill="#831843">从 Session commit publications 推进,</text>
  <text x="536" y="288" font-size="9.5" fill="#831843">terminal 即删节点;丢弃可由存储重建,</text>
  <text x="536" y="300" font-size="9.5" fill="#831843">不是第二个权威</text>

  <text x="24" y="336" font-size="10" fill="#64748b">join:allSettled = 全部 done 才恢复;failFast = 首个失败同时 abort 其余(README Child Tasks 节,示例 24-child-tasks.ts)</text>
</svg>
